<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="description" content="Field playbook for partners and Autodesk teams working India Ministry of Defence accounts: departments, personas, discovery questions and solution fit.">
<title>India MoD Partner Playbook | Autodesk</title>
<style>

  :root{
    --orange:#F2510A;
    --orange-soft:#F09D4F;
    --ink:#0A0A0A;
    --warm:#F5F5F0;
    --blue:#1D91D0;
    --teal:#2AD0A9;
    --line:#E4E4DB;
    --paper:#FFFFFF;
    --muted:#5F5F58;
    --font-head:'Artifakt Legend','Artifakt Element',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    --font-body:'Artifakt Element','Artifakt Legend',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    --rail:272px;
    --tabbar:64px;
  }

  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    font-family:var(--font-body);
    font-size:16px;
    line-height:1.5;
    color:var(--ink);
    background:var(--warm);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--font-head);font-weight:700;margin:0;line-height:1.2}
  p{margin:0}
  button{font:inherit;color:inherit}
  a{color:var(--orange)}

  :focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}

  .skip{position:absolute;left:-9999px;top:0;background:var(--ink);color:#fff;padding:12px 16px;z-index:200}
  .skip:focus{left:8px;top:8px}

  /* ---------- shell ---------- */
  .layout{min-height:100vh}

  .rail{display:none}

  .topbar{
    position:sticky;top:0;z-index:60;
    background:var(--ink);color:#fff;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px) * 0);
    padding-left:max(16px,env(safe-area-inset-left));
    padding-right:max(16px,env(safe-area-inset-right));
  }
  .brand{display:flex;align-items:center;gap:10px}
  .brand__mark{
    display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;flex:0 0 26px;border-radius:5px;background:var(--orange);
  }
  .brand__mark svg{width:16px;height:16px;display:block}
  .brand__text{display:block;font-family:var(--font-head);font-size:14px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;line-height:1.15}
  .brand__sub{display:block;font-size:11px;color:#B8B8B0;letter-spacing:.02em;margin-top:2px}

  .search{position:relative;margin-top:10px}
  .search input{
    width:100%;font:inherit;font-size:16px;
    padding:11px 40px 11px 38px;
    border-radius:10px;border:1px solid #2E2E2C;background:#1A1A18;color:#fff;
  }
  .search input::placeholder{color:#87877F}
  .search input:focus{border-color:var(--orange);outline:none}
  .search__icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#87877F;pointer-events:none}
  .search__clear{
    position:absolute;right:4px;top:50%;transform:translateY(-50%);
    width:34px;height:34px;border:0;background:none;color:#B8B8B0;cursor:pointer;
    border-radius:8px;font-size:18px;line-height:1;
  }
  .search__clear:hover{color:#fff}

  main{
    padding:16px max(16px,env(safe-area-inset-right)) calc(var(--tabbar) + 28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left));
  }
  .wrap{max-width:880px;margin:0 auto}
  .wrap--wide{max-width:1440px}

  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:70;
    display:grid;grid-template-columns:repeat(6,1fr);
    background:var(--paper);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .tab{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    min-height:var(--tabbar);padding:6px 2px;border:0;background:none;cursor:pointer;
    font-size:10.5px;letter-spacing:.01em;color:var(--muted);
  }
  .tab svg{width:20px;height:20px}
  .tab[aria-current="page"]{color:var(--orange);font-weight:700}
  .tab[aria-current="page"] svg{stroke-width:2.4}

  /* ---------- view header ---------- */
  .view-head{margin-bottom:14px}
  .view-head h1{font-size:26px;letter-spacing:-.01em}
  .view-head p{color:var(--muted);font-size:14px;margin-top:6px}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;margin:0 -16px 4px;padding-left:16px;padding-right:16px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;white-space:nowrap;cursor:pointer;
    border:1px solid var(--line);background:var(--paper);color:var(--ink);
    border-radius:999px;padding:9px 14px;font-size:13px;min-height:38px;
  }
  .chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

  .resultbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:10px 0 12px}
  .linkbtn{
    border:1px solid var(--line);background:var(--paper);border-radius:8px;
    padding:7px 12px;font-size:12.5px;cursor:pointer;min-height:34px;color:var(--ink);
  }
  .linkbtn:hover{border-color:var(--orange);color:var(--orange)}

  /* ---------- qualification strip and rank bar ---------- */
  .dstrip{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;
    margin:14px 0 12px;
  }
  .dstrip__s{
    padding:10px 12px;border-radius:12px;background:var(--paper);border:1px solid var(--line);
  }
  .dstrip__s b{display:block;font-family:var(--font-head);font-size:21px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
  .dstrip__s span{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .dstrip__s--mark b{color:#B7791F}

  .dbar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin:0 0 14px;font-size:13px}
  .dbar__n{color:var(--muted)}
  .dbar__sort{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
  .dbar__lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-right:2px}
  .dbar__sort button{
    border:1px solid var(--line);background:var(--paper);color:var(--muted);
    font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:999px;cursor:pointer;min-height:32px;
  }
  .dbar__sort button:hover{border-color:var(--orange);color:var(--orange)}
  .dbar__sort button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

  /* ---------- cluster + cards ---------- */
  .cluster{margin:22px 0 10px;display:flex;align-items:baseline;gap:10px}
  .cluster h2{
    font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);
    display:flex;align-items:center;gap:8px;
  }
  .cluster h2::before{
    content:"";width:9px;height:9px;border-radius:50%;background:var(--cl,var(--line));flex:none;
  }
  .cluster h2 span{
    font-size:10.5px;letter-spacing:.02em;color:var(--muted);opacity:.7;
    background:var(--warm);border-radius:999px;padding:2px 7px;
  }
  .cluster--rank h2::before{background:var(--orange)}
  .cluster::after{content:"";flex:1;height:1px;background:var(--line)}

  .rankrow{display:flex;align-items:flex-start;gap:10px}
  .rankrow__n{
    flex:0 0 30px;text-align:right;padding-top:16px;
    font-family:var(--font-head);font-weight:700;font-size:14px;color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .rankrow .card{flex:1;min-width:0}

  .card{
    background:var(--paper);border:1px solid var(--line);border-radius:14px;
    margin-bottom:10px;overflow:hidden;border-left:3px solid var(--cl,var(--line));
  }
  .card--marked{background:linear-gradient(90deg,rgba(251,191,36,.09),var(--paper) 220px)}
  .card__head{display:flex;align-items:flex-start}
  .card__btn{
    flex:1;min-width:0;display:flex;align-items:flex-start;gap:10px;
    width:100%;min-height:60px;padding:13px 6px 13px 13px;
    border:0;background:none;text-align:left;cursor:pointer;
  }
  .card__caret{width:18px;height:18px;flex:0 0 18px;margin-top:3px;color:var(--muted);transition:transform .18s ease}
  .card__btn[aria-expanded="true"] .card__caret{transform:rotate(90deg);color:var(--orange)}
  .card__body{min-width:0;flex:1;display:flex;flex-direction:column;gap:5px}
  .card__title{font-family:var(--font-head);font-weight:700;font-size:15px;line-height:1.3;color:var(--orange)}
  .card__full{color:var(--ink);font-weight:700;margin-left:8px}
  .card__where{
    font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;
    letter-spacing:.01em;
  }
  .card__where i{width:8px;height:8px;border-radius:50%;background:var(--cl,var(--line));flex:none}
  .card__hook{
    font-size:13px;line-height:1.5;color:var(--ink);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card__sig{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;margin-top:2px}
  .sig{font-size:11.5px;color:var(--muted)}
  .sig b{font-family:var(--font-head);font-size:13.5px;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:3px}
  .pips{display:inline-flex;gap:4px;align-items:center}
  .pip{
    width:9px;height:9px;border-radius:2px;background:var(--line);
    display:inline-block;opacity:.55;
  }
  .pip.on{opacity:1}
  .card__prods{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
  .pchip{
    font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:999px;
    background:var(--warm);color:var(--muted);
    border-left:3px solid var(--pf,var(--line));
  }
  .pchip--more{border-left-color:transparent;opacity:.75}
  .card__tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .tag{
    font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;
    padding:3px 7px;border-radius:4px;background:var(--warm);color:var(--muted);
  }
  .tag--arm{background:#EAF4FB;color:#12658F}

  .star{
    flex:0 0 46px;width:46px;min-height:60px;border:0;background:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:#C3C3BB;
  }
  .star svg{width:19px;height:19px}
  .star[aria-pressed="true"]{color:var(--orange)}
  .star[aria-pressed="true"] svg{fill:currentColor}

  .panel{padding:2px 14px 16px;border-top:1px solid var(--line)}
  .sec{margin-top:16px}
  .sec__h{
    font-family:var(--font-head);font-size:11px;font-weight:700;
    text-transform:uppercase;letter-spacing:.11em;color:var(--muted);
    display:flex;align-items:center;gap:7px;margin-bottom:8px;
  }
  .sec__h::before{content:"";width:14px;height:2px;background:var(--orange);flex:0 0 14px}
  .sec p{font-size:14.5px}
  .lede{font-size:15px;line-height:1.55}

  .whynow{background:var(--warm);border-radius:10px;padding:11px 13px;font-size:14px;line-height:1.5}

  .persona{border-left:3px solid var(--blue);padding:2px 0 2px 11px;margin-bottom:12px}
  .persona__t{font-family:var(--font-head);font-weight:700;font-size:14.5px}
  .persona__r{font-size:12.5px;color:var(--muted);margin-top:1px}
  .persona__d{font-size:13.5px;margin-top:5px}
  .persona__d b{font-weight:700}

  .qlist{list-style:none;margin:0;padding:0;counter-reset:q}
  .qlist li{
    counter-increment:q;position:relative;padding:0 0 0 27px;margin-bottom:11px;
    font-size:14.5px;line-height:1.5;
  }
  .qlist li::before{
    content:counter(q);position:absolute;left:0;top:1px;
    width:19px;height:19px;border-radius:50%;background:var(--orange);color:#fff;
    font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-head);
  }
  .copybtn{
    display:inline-flex;align-items:center;gap:7px;
    border:1px solid var(--line);background:var(--paper);border-radius:9px;
    padding:9px 13px;font-size:13px;cursor:pointer;min-height:40px;margin-top:2px;
  }
  .copybtn svg{width:14px;height:14px}
  .copybtn:hover{border-color:var(--ink)}
  .copybtn.ok{border-color:var(--teal);color:#0C7A61}

  .fit{list-style:none;margin:0;padding:0}
  .fit li{display:flex;gap:9px;font-size:14px;line-height:1.5;margin-bottom:9px}
  .fit li::before{content:"";flex:0 0 6px;width:6px;height:6px;border-radius:50%;background:var(--teal);margin-top:7px}
  .fit b{font-family:var(--font-head);font-weight:700}

  .kv{display:grid;gap:10px;margin-top:16px}
  .kv__i{background:var(--warm);border-radius:10px;padding:11px 13px}
  .kv__k{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--muted);margin-bottom:3px}
  .kv__v{font-size:13.5px;line-height:1.5}
  .kv__i--warn{background:#FDF0EA}
  .kv__i--warn .kv__k{color:#B03A05}

  /* ---------- roles ---------- */
  .role{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:9px}
  .role__t{font-family:var(--font-head);font-weight:700;font-size:15px}
  .role__w{font-size:13px;color:var(--muted);margin-top:4px}
  .role__links{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .jump{
    border:1px solid var(--line);background:var(--warm);border-radius:999px;
    padding:6px 11px;font-size:12.5px;cursor:pointer;min-height:34px;
  }
  .jump:hover{border-color:var(--orange);color:var(--orange)}

  /* ---------- question bank ---------- */
  .qgroup{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-bottom:9px;overflow:hidden}
  .qgroup__btn{
    width:100%;display:flex;align-items:center;gap:9px;padding:13px 14px;
    min-height:52px;border:0;background:none;text-align:left;cursor:pointer;
  }
  .qgroup__t{flex:1;font-family:var(--font-head);font-weight:700;font-size:15px;line-height:1.3}
  .qgroup__n{flex:0 0 auto;font-size:12.5px;color:var(--muted)}
  .qgroup__body{padding:0 14px 12px}

  /* ---------- buying / objections ---------- */
  .buy{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
  .buy__t{font-family:var(--font-head);font-weight:700;font-size:15px}
  .buy__b{font-size:14px;line-height:1.55;margin-top:6px}
  .buy__use{font-size:13px;line-height:1.5;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);color:var(--muted)}
  .buy__use b{color:var(--ink)}

  .obj{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-bottom:9px;overflow:hidden}
  .obj__btn{
    width:100%;display:flex;gap:10px;align-items:flex-start;
    padding:14px;min-height:56px;border:0;background:none;text-align:left;cursor:pointer;
  }
  .obj__q{font-family:var(--font-head);font-weight:700;font-size:14.5px;line-height:1.35}
  .obj__body{padding:0 14px 15px;font-size:14px;line-height:1.6}
  .obj__body p + p{margin-top:9px}

  .callout{
    border-left:3px solid var(--orange);background:#FDF0EA;
    padding:12px 13px;border-radius:0 10px 10px 0;font-size:14px;line-height:1.55;margin-bottom:14px;
  }
  .callout b{font-family:var(--font-head)}

  /* ---------- steps ---------- */
  .step{display:flex;gap:12px;margin-bottom:14px}
  .step__n{
    flex:0 0 30px;width:30px;height:30px;border-radius:50%;
    background:var(--ink);color:#fff;font-family:var(--font-head);font-weight:700;font-size:12px;
    display:flex;align-items:center;justify-content:center;
  }
  .step__t{font-family:var(--font-head);font-weight:700;font-size:14.5px}
  .step__b{font-size:14px;line-height:1.5;margin-top:3px}

  /* ---------- glossary ---------- */
  .gl{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .gl__i{display:grid;grid-template-columns:84px 1fr;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px}
  .gl__i:last-child{border-bottom:0}
  .gl__a{font-family:var(--font-head);font-weight:700;color:var(--orange)}
  .gl__d{line-height:1.45}

  /* ---------- misc ---------- */
  mark{background:#FFE7A3;color:inherit;padding:0 1px;border-radius:2px}
  .empty{text-align:center;padding:44px 16px;color:var(--muted);font-size:14.5px}
  .note{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
  .toast{
    position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar) + 18px + env(safe-area-inset-bottom,0px));
    background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;
    z-index:120;opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .toast.show{opacity:1}

  /* ---------- desktop ---------- */
  @media (min-width:1024px){
    .layout{display:grid;grid-template-columns:var(--rail) 1fr}
    .rail{
      display:block;position:sticky;top:0;align-self:start;
      height:100vh;overflow-y:auto;background:var(--ink);color:#fff;padding:20px 16px;
    }
    .rail .brand{margin-bottom:22px}
    .rail nav{display:flex;flex-direction:column;gap:3px}
    .rail .tab{
      flex-direction:row;justify-content:flex-start;gap:11px;
      min-height:44px;padding:10px 12px;border-radius:9px;font-size:14px;color:#C9C9C1;text-align:left;
    }
    .rail .tab:hover{background:#1D1D1B;color:#fff}
    .rail .tab[aria-current="page"]{background:var(--orange);color:#fff}
    .rail .tab[aria-current="page"] svg{stroke-width:2.2}
    .rail__foot{margin-top:24px;padding-top:16px;border-top:1px solid #2A2A28;font-size:11.5px;color:#87877F;line-height:1.5}
    .topbar{background:var(--paper);color:var(--ink);border-bottom:1px solid var(--line);padding:12px 24px}
    .topbar .brand{display:none}
    .search{margin-top:0}
    .search input{background:var(--warm);border-color:var(--line);color:var(--ink)}
    .search input::placeholder{color:var(--muted)}
    .search__icon,.search__clear{color:var(--muted)}
    .tabbar{display:none}
    main{padding:24px 24px 56px}
    .chips{flex-wrap:wrap;overflow:visible;margin:0 0 4px;padding-left:0;padding-right:0}
    .view-head h1{font-size:30px}
    .kv{grid-template-columns:1fr 1fr}
    .toast{bottom:28px}
  }

  /* ---------- print ---------- */
  @media print{
    :root{--tabbar:0px}
    body{background:#fff;font-size:11pt}
    .rail,.tabbar,.topbar,.chips,.star,.copybtn,.linkbtn,.resultbar,.toast,.jump,.skip{display:none !important}
    main{padding:0}
    .card,.obj,.buy,.qgroup,.rolegrp,.role,.gl{break-inside:avoid;border-color:#ccc}
    .panel[hidden],.obj__body[hidden],.rolegrp__body[hidden],.qgroup__body[hidden]{display:block !important}
    .card__caret,.obj__btn svg{display:none}
    a{color:inherit;text-decoration:none}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important}
  }
  /* ---------- v2: filters ---------- */
  .toolbar{display:flex;gap:8px;margin-top:10px;align-items:stretch}
  .filterbtn{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;
    border:1px solid #2E2E2C;background:#1A1A18;color:#fff;
    border-radius:10px;padding:11px 14px;font-size:14px;cursor:pointer;min-height:44px;
  }
  .filterbtn__badge{
    background:var(--orange);color:#fff;border-radius:999px;
    min-width:20px;height:20px;padding:0 6px;font-size:11px;font-weight:700;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .actfilters{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
  .actf{
    display:inline-flex;align-items:center;gap:5px;
    border:1px solid var(--line);background:var(--paper);border-radius:999px;
    padding:7px 10px;font-size:12.5px;min-height:36px;
  }
  .actf button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:0 2px}
  .clearall{border:0;background:none;color:var(--orange);font-size:13px;cursor:pointer;padding:7px 10px;min-height:36px}

  .sheetbackdrop{
    position:fixed;inset:0;background:rgba(10,10,10,.45);z-index:80;
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .sheetbackdrop.show{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:90;
    background:var(--paper);border-radius:16px 16px 0 0;
    max-height:min(88vh,720px);display:flex;flex-direction:column;
    transform:translateY(100%);transition:transform .25s ease,opacity .2s ease;
    padding-bottom:env(safe-area-inset-bottom,0px);
    visibility:hidden;pointer-events:none;
  }
  .sheet.show{transform:translateY(0);visibility:visible;pointer-events:auto}
  .sheet__handle{width:40px;height:4px;background:var(--line);border-radius:99px;margin:10px auto 0}
  .sheet__head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px}
  .sheet__head h2{font-size:18px}
  .sheet__x{
    width:36px;height:36px;flex:0 0 auto;border:0;background:none;
    color:var(--muted);cursor:pointer;border-radius:8px;font-size:20px;line-height:1;
  }
  .sheet__x:hover{color:var(--ink);background:var(--warm)}
  .sheet__body{overflow-y:auto;padding:0 16px 12px;flex:1}
  .sheet__foot{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
  .sheet__foot button{flex:1;min-height:46px;border-radius:10px;font-size:15px;cursor:pointer}
  .btn-primary{background:var(--ink);color:#fff;border:0}
  .btn-secondary{background:var(--warm);color:var(--ink);border:1px solid var(--line)}

  .facet{margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--line)}
  .facet:last-child{border-bottom:0;padding-bottom:0}
  .facet__h{font-family:var(--font-head);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:8px}
  .facet__hint{font-size:12.5px;color:var(--muted);margin:-4px 0 9px;line-height:1.45}
  .facet__opts{display:flex;flex-wrap:wrap;gap:7px}
  .fopt{
    display:inline-flex;align-items:center;gap:7px;
    border:1px solid var(--line);background:var(--warm);border-radius:999px;
    padding:9px 13px;font-size:13px;cursor:pointer;min-height:40px;
  }
  .fopt__dot{width:9px;height:9px;border-radius:50%;background:var(--fo,var(--line));flex:none}
  .fopt__n{
    font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;
    background:rgba(0,0,0,.06);border-radius:999px;padding:1px 6px;
  }
  .fopt[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .fopt[aria-pressed="true"] .fopt__n{background:rgba(255,255,255,.2);color:#fff}
  .fopt--empty{opacity:.4}
  .fopt:disabled{opacity:.45;cursor:not-allowed}

  .actf--dot{padding-left:9px}
  .actf--dot .fopt__dot{margin-right:1px}

  .facet__sub{margin-top:12px;padding-left:12px;border-left:2px solid var(--line)}
  .searchhint{font-size:13px;color:var(--muted);margin:-4px 0 12px}

  /* ---------- v2: breadcrumb ---------- */
  .crumb{font-size:12.5px;color:var(--muted);margin-bottom:10px;line-height:1.5}
  .crumb span{color:var(--ink)}
  .crumb .sep{margin:0 5px;color:#C3C3BB}

  /* ---------- v2: units / places ---------- */
  .unitlist{list-style:none;margin:0;padding:0}
  .unitlist li{
    display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;
    padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;
  }
  .unitlist li:last-child{border-bottom:0}
  .unitlist b{font-family:var(--font-head);font-weight:700;font-size:14px}
  .unitlist .loc{font-size:13px;color:var(--muted)}
  .unitlist .approx{font-size:11px;color:var(--orange-soft);text-transform:uppercase;letter-spacing:.05em}

  .place-state{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
  .place-state__btn{
    width:100%;display:flex;align-items:center;gap:10px;padding:14px;
    min-height:52px;border:0;background:none;text-align:left;cursor:pointer;
  }
  .place-state__t{font-family:var(--font-head);font-weight:700;font-size:15px;flex:1}
  .place-state__c{font-size:13px;color:var(--muted)}
  .place-city{padding:0 14px 12px}
  .place-city__h{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:8px 0 6px;font-weight:700}
  .place-unit{
    display:flex;flex-wrap:wrap;gap:6px;align-items:center;
    padding:9px 0;border-top:1px solid var(--line);font-size:14px;
  }
  .place-unit:first-child{border-top:0}
  .place-unit b{font-weight:700}
  .place-unit .org{font-size:12.5px;color:var(--muted)}

  /* ---------- v2: persona tree ---------- */
  .ptree{margin:0;padding:0;list-style:none}
  .ptree li{margin-bottom:10px}
  .ptree .persona{margin-bottom:0}
  .ptree .persona--d2{margin-left:14px;border-color:#7EC8E8}
  .ptree .persona--d3{margin-left:28px;border-color:#2AD0A9}
  .ptree .persona--flat{margin-left:0}
  .lvlbadge{
    display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;
    text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--warm);color:var(--muted);margin-left:6px;
  }
  .chain{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.45}

  .rolegrp{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-bottom:9px;overflow:hidden}
  .rolegrp__btn{
    width:100%;display:flex;align-items:center;gap:9px;padding:13px 14px;
    min-height:52px;border:0;background:none;text-align:left;cursor:pointer;
  }
  .rolegrp__t{flex:1;font-family:var(--font-head);font-weight:700;font-size:15px;line-height:1.3}
  .rolegrp__n{flex:0 0 auto;font-size:12.5px;color:var(--muted)}
  .rolegrp__body{padding:0 14px 12px}
  .rolegrp__body .role{background:var(--warm)}

  .hqline{font-size:13px;color:var(--muted);margin-top:6px}
  .hqline b{color:var(--ink)}

  .tabbar{grid-template-columns:repeat(7,1fr)}
  .tab{font-size:9px}

  .topbar__tools{display:block;margin-top:10px}
  .topbar__tools .search{margin-top:0}
  .topbar__tools .toolbar{margin-top:8px}

  @media (min-width:1024px){
    .topbar{display:flex;align-items:center;gap:12px}
    .topbar .brand{display:none}
    .topbar__tools{flex:1;display:flex;align-items:center;gap:12px;margin-top:0}
    .topbar__tools .search{flex:1;margin-top:0}
    .topbar__tools .toolbar{margin-top:0;margin-left:0;flex:0 0 auto}
    .filterbtn{background:var(--warm);color:var(--ink);border-color:var(--line)}
    .sheetbackdrop{background:rgba(10,10,10,.16)}
    .sheet{
      left:auto;right:24px;bottom:auto;top:76px;
      width:min(700px,calc(100vw - var(--rail) - 48px));
      max-height:min(72vh,580px);
      border:1px solid var(--line);border-radius:14px;
      box-shadow:0 18px 46px rgba(10,10,10,.20);
      transform:translateY(-10px);opacity:0;padding-bottom:0;
    }
    .sheet.show{transform:none;opacity:1}
    .sheet__handle{display:none}
    .sheet__head{padding:14px 18px 8px}
    .sheet__body{padding:0 18px 12px}
    .sheet__foot{padding:12px 18px;justify-content:flex-end}
    .sheet__foot button{flex:0 0 auto;min-width:132px}
    .tab{font-size:14px}
  }

  /* ---------- india map (places view) ---------- */
  .imap{
    position:relative;margin-bottom:18px;border-radius:20px;overflow:hidden;
    background:linear-gradient(165deg,#0c0e18 0%,#08090f 45%,#050508 100%);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 28px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.04);
    padding:16px;
  }
  .imap__head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:12px}
  .imap__title{font-family:var(--font-head);font-weight:700;font-size:15px;color:#fff;letter-spacing:.01em}
  .imap__sub{font-size:12px;color:rgba(255,255,255,.45)}
  .imap__filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
  .imap__chip{
    display:inline-flex;align-items:center;gap:7px;cursor:pointer;
    border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);
    color:rgba(255,255,255,.72);border-radius:999px;padding:7px 13px;
    font-size:11.5px;font-weight:600;letter-spacing:.02em;min-height:34px;
    transition:background .15s ease,border-color .15s ease,color .15s ease;
  }
  .imap__chip i{width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:0 0 9px currentColor;flex:none}
  .imap__chip:hover{background:rgba(255,255,255,.09);color:#fff}
  .imap__chip[aria-pressed="true"]{
    background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.4);color:#fff;
  }
  .imap__chip--all[aria-pressed="true"]{background:#F2510A;border-color:#F2510A}
  .imap__chip b{font-weight:700;opacity:.65;font-variant-numeric:tabular-nums}

  .imap__stage{
    position:relative;border-radius:14px;overflow:hidden;
    background:
      repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(255,255,255,.02) 39px,rgba(255,255,255,.02) 40px),
      repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(255,255,255,.02) 39px,rgba(255,255,255,.02) 40px),
      radial-gradient(ellipse at 50% 40%,#141a2c 0%,#0b0d16 55%,#050508 100%);
  }
  .imap__svg{display:block;width:100%;height:auto;max-height:none;touch-action:manipulation}
  .imap-state{
    fill:rgba(90,120,180,.10);stroke:rgba(120,170,235,.28);stroke-width:1;
    transition:fill .2s ease,stroke .2s ease;
  }
  .imap-state--has{cursor:pointer}
  .imap-state--has:hover{stroke:rgba(255,255,255,.75);stroke-width:1.6}
  .imap-state--sel{stroke:#fff;stroke-width:2}
  .imap-city{cursor:pointer;transition:opacity .2s ease}
  .imap-city__halo{opacity:.28}
  .imap-city__dot{stroke:rgba(255,255,255,.85);stroke-width:1.1}
  .imap-city:hover .imap-city__dot{stroke-width:2}
  .imap-city--dim{opacity:.12;pointer-events:none}
  .imap-city--sel .imap-city__dot{stroke:#fff;stroke-width:2.4}
  @keyframes imap-ping{0%{r:4;opacity:.75}70%{opacity:0}100%{r:26;opacity:0}}
  .imap-city--sel .imap-city__ping{animation:imap-ping 2s ease-out infinite;fill:none;stroke:#fff;stroke-width:1.2}
  .imap__label{
    font-size:13px;fill:rgba(255,255,255,.34);font-weight:600;letter-spacing:.06em;
    text-transform:uppercase;pointer-events:none;
  }

  .imap__body{display:grid;gap:14px}
  .imap__stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px;margin-top:12px}
  .imap__stat{
    padding:9px 10px;border-radius:10px;text-align:center;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
  }
  .imap__stat b{display:block;font-size:19px;font-weight:700;color:#fff;line-height:1.2;font-variant-numeric:tabular-nums}
  .imap__stat span{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:rgba(255,255,255,.45)}
  .imap__hint{margin-top:10px;font-size:11.5px;color:rgba(255,255,255,.38);text-align:center}
  .imap__reset{
    border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;
    border-radius:999px;padding:6px 13px;font-size:11.5px;cursor:pointer;min-height:32px;
  }
  .imap__reset:hover{background:rgba(255,255,255,.13)}

  .imap-tip{
    position:fixed;z-index:200;pointer-events:none;max-width:min(300px,calc(100vw - 24px));
    padding:11px 13px;border-radius:12px;
    background:rgba(10,12,20,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.12);box-shadow:0 12px 40px rgba(0,0,0,.5);
    color:rgba(255,255,255,.9);font-size:12.5px;line-height:1.45;
  }
  .imap-tip[hidden]{display:none}
  .imap-tip__t{font-family:var(--font-head);font-weight:700;font-size:14px;color:#fff;margin-bottom:5px}
  .imap-tip__row{color:rgba(255,255,255,.55);font-size:11.5px;margin-top:3px}
  .imap-tip__bars{margin-top:7px;display:flex;flex-direction:column;gap:3px}
  .imap-tip__bar{display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,.7)}
  .imap-tip__bar i{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
  .imap-tip__bar u{text-decoration:none;margin-left:auto;font-variant-numeric:tabular-nums;color:#fff}

  @media (min-width:1024px){
    .imap{padding:20px}
    .imap__body{grid-template-columns:minmax(0,1fr) 250px;align-items:start}
    .imap__stats{grid-template-columns:1fr 1fr;margin-top:0}
    .imap__side{display:flex;flex-direction:column;gap:12px}
    .imap__hint{margin-top:0;text-align:left;line-height:1.5}
  }
  .imap__svg{max-height:clamp(380px,66vh,720px);margin:0 auto}
  @media (prefers-reduced-motion:reduce){
    .imap-city--sel .imap-city__ping{animation:none !important}
  }
  @media print{
    .imap__filters,.imap__reset,.imap-tip{display:none !important}
    .imap{background:#fff;border-color:#ccc;box-shadow:none}
  }

  /* ---------- account map (bubble view) ---------- */
  .bmap-wrap{margin-bottom:20px}
  .bmap-console{
    background:linear-gradient(165deg,#0c0e18 0%,#08090f 45%,#050508 100%);
    border:1px solid rgba(255,255,255,.08);border-radius:20px;
    padding:16px;box-shadow:0 28px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.04);
  }
  .bmap-nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:10px;font-size:13px}
  .bmap-nav button{border:0;background:none;color:#F2510A;cursor:pointer;padding:6px 0;font-size:13px;min-height:36px}
  .bmap-nav button:hover{text-decoration:underline;color:#ff7a3d}
  .bmap-crumb{color:rgba(255,255,255,.45)}
  .bmap-crumb .sep{margin:0 6px;color:rgba(255,255,255,.2)}
  .bmap-crumb b{color:rgba(255,255,255,.92)}
  .bmap-legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-bottom:12px;font-size:11.5px;color:rgba(255,255,255,.5)}
  .bmap-legend span{display:inline-flex;align-items:center;gap:6px}
  .bmap-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;box-shadow:0 0 10px currentColor}
  .bmap-stage{
    position:relative;width:100%;aspect-ratio:1;border-radius:16px;overflow:hidden;
    background:
      repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(255,255,255,.025) 39px,rgba(255,255,255,.025) 40px),
      repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(255,255,255,.025) 39px,rgba(255,255,255,.025) 40px),
      radial-gradient(ellipse at 50% 40%,#1a1f35 0%,#0d0f18 50%,#050508 100%);
    box-shadow:inset 0 0 120px rgba(0,0,0,.6),inset 0 0 60px rgba(59,130,246,.05);
  }
  .bmap-stage::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.55) 100%);
  }
  .bmap-stage::after{
    content:"";position:absolute;inset:-50%;pointer-events:none;opacity:.12;
    background:conic-gradient(from 0deg at 50% 50%,transparent,rgba(59,130,246,.4),transparent,rgba(242,81,10,.3),transparent);
    animation:bmap-sheen 24s linear infinite;
  }
  @keyframes bmap-sheen{to{transform:rotate(360deg)}}
  .bmap-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
  .bmap-ring{opacity:.35;transform-origin:center;animation:bmap-dash 90s linear infinite}
  .bmap-ring--2{animation-duration:140s;animation-direction:reverse;opacity:.25}
  .bmap-ring--3{animation-duration:200s;opacity:.18}
  @keyframes bmap-dash{to{stroke-dashoffset:-200}}
  .bmap-link{stroke:rgba(255,255,255,.08);stroke-width:1;stroke-dasharray:4 8;animation:bmap-flow 3s linear infinite}
  .bmap-link--active{stroke:rgba(255,255,255,.35);stroke-width:1.5}
  @keyframes bmap-flow{to{stroke-dashoffset:-24}}
  @keyframes bmap-pulse{0%,100%{opacity:.7;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}}
  @keyframes bmap-in{from{opacity:0;transform:translate(-50%,-50%) scale(.72)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  @keyframes bmap-halo{to{transform:translate(-50%,-50%) rotate(360deg)}}
  .bmap-bubble{
    position:absolute;z-index:3;transform:translate(-50%,-50%);
    border:0;border-radius:50%;cursor:pointer;color:#fff;text-align:center;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:8px;line-height:1.2;font-family:var(--font-head);font-weight:700;
    box-shadow:0 0 0 1px rgba(255,255,255,.18) inset,0 0 20px var(--bmap-glow,rgba(255,255,255,.15)),0 10px 32px rgba(0,0,0,.5);
    animation:bmap-in .45s ease backwards;
    transition:transform .15s ease,box-shadow .2s ease,opacity .2s ease;
  }
  .bmap-bubble:hover,.bmap-bubble:focus-visible{
    transform:translate(-50%,-50%) scale(1.08);
    box-shadow:0 0 0 1px rgba(255,255,255,.35) inset,0 0 32px var(--bmap-glow,rgba(255,255,255,.35)),0 14px 40px rgba(0,0,0,.55);
    outline:none;
  }
  .bmap-bubble--hub{
    z-index:6;font-size:12px;
    background:radial-gradient(circle at 35% 28%,#fff 0%,#F2510A 38%,#1a0800 72%,#0A0A0A 100%);
    box-shadow:0 0 0 2px rgba(242,81,10,.5) inset,0 0 48px rgba(242,81,10,.55),0 0 80px rgba(242,81,10,.25);
    animation:bmap-in .35s ease backwards,bmap-pulse 3s ease-in-out infinite;
  }
  .bmap-bubble--hub .bmap-bubble__sub{font-size:10px;font-weight:600;opacity:.92;margin-top:4px;letter-spacing:.02em}
  .bmap-bubble__label{
    font-size:var(--bmap-fs,11px);max-width:94%;letter-spacing:.03em;text-transform:uppercase;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
    overflow-wrap:break-word;hyphens:none;line-height:1.32;
  }
  .bmap-bubble__sub{font-size:calc(var(--bmap-fs,11px) * .78);font-weight:600;opacity:.88;margin-top:3px;letter-spacing:.02em}
  .bmap-bubble--dim{opacity:.2;pointer-events:none}
  .bmap-bubble--sel{
    box-shadow:0 0 0 2px #fff inset,0 0 36px var(--bmap-glow,rgba(242,81,10,.7)),0 0 60px var(--bmap-glow,rgba(242,81,10,.35));
  }
  .bmap-bubble--sel::before{
    content:"";position:absolute;inset:-6px;border-radius:50%;pointer-events:none;z-index:-1;
    background:conic-gradient(from 0deg,var(--bmap-glow,rgba(242,81,10,.6)),transparent,var(--bmap-glow,rgba(242,81,10,.4)),transparent);
    animation:bmap-halo 4s linear infinite;opacity:.7;
  }
  .bmap-hub-caption{
    position:absolute;left:50%;top:calc(50% + 72px);transform:translateX(-50%);
    z-index:4;max-width:min(280px,80%);text-align:center;pointer-events:none;
    font-size:11px;line-height:1.35;color:rgba(255,255,255,.55);letter-spacing:.01em;
  }
  /* ----- right rail: scope summary, product slice, account list ----- */
  .bmap-side{display:flex;flex-direction:column;gap:12px;min-width:0}
  .bmap-scope{
    padding:16px 18px;border-radius:16px;
    background:rgba(15,17,26,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.88);
    box-shadow:0 16px 48px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06);
  }
  .bmap-scope::before{
    content:"";display:block;height:3px;border-radius:3px;margin:-16px -18px 13px;
    background:linear-gradient(90deg,var(--bmap-accent,#F2510A),transparent);
  }
  .bmap-scope__t{font-family:var(--font-head);font-weight:700;font-size:17px;color:#fff;line-height:1.25}
  .bmap-scope__m{font-size:12px;color:rgba(255,255,255,.5);margin-top:4px}
  .bmap-scope__stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}
  .bmap-scope__stats div{padding:7px 4px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);text-align:center}
  .bmap-scope__stats b{display:block;font-size:17px;font-weight:700;color:#fff;line-height:1.2;font-variant-numeric:tabular-nums}
  .bmap-scope__stats span{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:rgba(255,255,255,.45)}

const $ = (sel, root) => (root || document).querySelector(sel);

const ESC_MAP = { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" };
const esc = (s) => String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, (c) => ESC_MAP[c]);

const richEsc = (s) => esc(s).replace(/&lt;b&gt;/g, "<b>").replace(/&lt;\/b&gt;/g, "</b>");

const escRe = (s) => String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

function hl(text) {
  const out = esc(text);
  const q = state.query.trim();
  if (q.length < 2) return out;
  return out.replace(new RegExp("(" + escRe(q) + ")", "gi"), "<mark>$1</mark>");
}

  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>',
  map: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="5" cy="8" r="2"/><circle cx="19" cy="8" r="2"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="17" r="2"/><path d="M12 9V6M9.2 9.8l-2-1.5M14.8 9.8l2-1.5M9.5 15.5l-1.5 1.8M14.5 15.2l1.8 1.3"/></svg>'
};

const VIEWS = [
  { id: "departments", label: "Accounts", short: "Accounts", icon: ICON.dept },
  { id: "map", label: "Account map", short: "Map", icon: ICON.map },
  { id: "places", label: "Places", short: "Places", icon: ICON.places },
  { id: "roles", label: "Find by role", short: "Roles", icon: ICON.role },
  { id: "questions", label: "Question bank", short: "Ask", icon: ICON.ask },
  { id: "buying", label: "How MoD buys", short: "Buying", icon: ICON.buy },
  { id: "glossary", label: "Glossary", short: "Terms", icon: ICON.gloss }
];

const STORE_KEY = "mod-playbook-bookmarks-v2";

function loadBookmarks() {
  try {
    const raw = window.localStorage.getItem(STORE_KEY);
    if (typeof raw !== "string") return new Set();
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? new Set(parsed.filter((x) => typeof x === "string")) : new Set();
  } catch (err) {
    return new Set();
  }
}

function saveBookmarks() {
  try {
    window.localStorage.setItem(STORE_KEY, JSON.stringify(Array.from(state.marks)));
  } catch (err) {
    /* storage unavailable */
  }
}

function emptyFilters() {
  return {
    ownership: new Set(),
    clusters: new Set(),
    portfolios: new Set(),
    products: new Set(),
    states: new Set(),
    cities: new Set(),
    tags: new Set(),
    onlyMarked: false
  };
}

function cloneFilters(f) {
  return {
    ownership: new Set(f.ownership),
    clusters: new Set(f.clusters),
    portfolios: new Set(f.portfolios),
    products: new Set(f.products),
    states: new Set(f.states),
    cities: new Set(f.cities),
    tags: new Set(f.tags),
    onlyMarked: f.onlyMarked === true
  };
}

/* Views where the filter facets actually change the result set. */
const FILTERABLE = { departments: true, map: true, places: true, roles: true, questions: true };

const state = {
  view: "departments",
  query: "",
  open: new Set(),
  marks: loadBookmarks(),
  filtersOpen: false,
  filters: emptyFilters(),
  draftFilters: emptyFilters(),
  bmap: { level: "root", own: null, cluster: null, deptId: null, selected: null, sort: "name", prod: null },
  pmap: { own: new Set() },
  dsort: "name",
  dgroup: true
};

let ALL_TAGS = [];
let CLUSTERS = [];
let ALL_STATES = [];
let CITIES_BY_STATE = {};
let ROLES = [];
let PLACES = [];

/* ============================ indexes ============================ */

function personaById(dept) {
  const map = {};
  dept.personas.forEach((p) => { map[p.id] = p; });
  return map;
}

function personaChain(dept, p) {
  const map = personaById(dept);
  const parts = [];
  let cur = p.parent;
  while (cur !== null && cur !== undefined && cur !== "") {
    const par = map[cur];
    if (par === undefined) break;
    parts.unshift(par.t);
    cur = par.parent;
  }
  if (parts.length === 0) return "";
  return "Reports to: " + parts.join(" \u2192 ");
}

function buildIndexes() {
  const tagSeen = [];
  const clusterSeen = [];
  const stateSeen = {};
  const placesMap = {};
  ROLES = [];

  DATA.departments.forEach((d) => {
    const pathStr = Array.isArray(d.path) ? d.path.join(" ") : "";
    const hqStr = d.hq ? (d.hq.city + " " + d.hq.state) : "";
    const unitsStr = (Array.isArray(d.units) ? d.units : []).map((u) => {
      return u.n + " " + (u.city || "") + " " + u.state + " " + (u.approx || "");
    }).join(" ");
    const personaStr = d.personas.map((p) => {
      return [p.id, p.t, p.lvl, p.parent, p.cares, p.measured].join(" ");
    }).join(" ");

    d._hay = [
      d.name, d.acr, d.arm, d.cluster, d.tags.join(" "),
      pathStr, hqStr, unitsStr, personaStr,
      d.what, d.whyNow, (d.facts || []).join(" "),
      d.questions.join(" "),
      d.fit.map((f) => f.p + " " + f.why).join(" "),
      d.route, d.blockers
    ].join(" ").toLowerCase();

    d.tags.forEach((t) => { if (tagSeen.indexOf(t) === -1) tagSeen.push(t); });
    if (clusterSeen.indexOf(d.cluster) === -1) clusterSeen.push(d.cluster);

    if (d.hq && d.hq.state) {
      if (stateSeen[d.hq.state] === undefined) stateSeen[d.hq.state] = {};
      if (d.hq.city) stateSeen[d.hq.state][d.hq.city] = true;
    }

    (Array.isArray(d.units) ? d.units : []).forEach((u) => {
      if (u.state) {
        if (stateSeen[u.state] === undefined) stateSeen[u.state] = {};
        const city = u.city || "(state-wide)";
        stateSeen[u.state][city] = true;

        if (placesMap[u.state] === undefined) placesMap[u.state] = {};
        if (placesMap[u.state][city] === undefined) placesMap[u.state][city] = [];
        placesMap[u.state][city].push({
          n: u.n,
          deptId: d.id,
          deptName: d.name,
          deptAcr: d.acr,
          approx: u.approx || "",
          hay: (u.n + " " + city + " " + u.state + " " + d.name + " " + d.acr).toLowerCase()
        });
      }
    });

    d.personas.forEach((p) => {
      ROLES.push({
        id: p.id,
        title: p.t,
        lvl: p.lvl,
        cares: p.cares,
        measured: p.measured,
        chain: personaChain(d, p),
        deptId: d.id,
        deptName: d.name,
        deptAcr: d.acr,
        cluster: d.cluster,
        hay: (p.t + " " + p.cares + " " + p.measured + " " + d.name + " " + d.acr + " " + personaChain(d, p)).toLowerCase()
      });
    });

    d._ownership = OWNERSHIP[d.id] || "Other";
    const prodMap = {};
    (Array.isArray(d.fit) ? d.fit : []).forEach((f) => {
      const norm = normalizeProduct(f.p);
      if (prodMap[norm.family] === undefined) {
        prodMap[norm.family] = { family: norm.family, portfolio: norm.portfolio, whys: [] };
      }
      prodMap[norm.family].whys.push({ why: f.why, raw: f.p });
    });
    d._products = Object.keys(prodMap).map((k) => prodMap[k]);
    d._unitCount = Array.isArray(d.units) ? d.units.length : 0;

    /* Qualification signal, all derived from the record itself rather than
       invented: how many documented use cases exist, and which Autodesk
       portfolios actually land. Breadth across portfolios is the strongest
       honest indicator that an account is worth more than a single product. */
    d._useCases = d._products.reduce((n, p) => n + p.whys.length, 0);
    d._portfolios = [];
    d._products.forEach((p) => {
      if (d._portfolios.indexOf(p.portfolio) === -1) d._portfolios.push(p.portfolio);
    });
    d._hay += " " + d._ownership + " " + d._products.map((p) => p.family).join(" ");
  });

  ALL_TAGS = tagSeen.sort((a, b) => a.localeCompare(b));
  CLUSTERS = clusterSeen;
  ALL_STATES = Object.keys(stateSeen).sort((a, b) => a.localeCompare(b));
  CITIES_BY_STATE = {};
  ALL_STATES.forEach((st) => {
    CITIES_BY_STATE[st] = Object.keys(stateSeen[st]).sort((a, b) => a.localeCompare(b));
  });
  ROLES.sort((a, b) => (a.lvl - b.lvl) || a.title.localeCompare(b.title));

  PLACES = ALL_STATES.map((st) => {
    const cities = CITIES_BY_STATE[st].map((city) => ({
      city: city,
      units: placesMap[st][city] || []
    }));
    return { state: st, cities: cities };
  });
}

/* ============================ filter logic ============================ */

function filterCount(f) {
  let n = 0;
  if (f.onlyMarked === true) n += 1;
  n += f.ownership.size + f.clusters.size + f.portfolios.size + f.products.size +
    f.states.size + f.cities.size + f.tags.size;
  return n;
}

function matches(hay) {
  const q = state.query.trim().toLowerCase();
  if (q === "") return true;
  return q.split(/\s+/).every((term) => hay.indexOf(term) !== -1);
}

function deptMatchesFilters(d, filters) {
  const f = filters || state.filters;
  if (f.onlyMarked === true && state.marks.has(d.id) === false) return false;
  if (f.ownership.size > 0 && f.ownership.has(d._ownership) === false) return false;
  if (f.clusters.size > 0 && f.clusters.has(d.cluster) === false) return false;
  if (f.tags.size > 0 && d.tags.some((t) => f.tags.has(t)) === false) return false;

  if (f.portfolios.size > 0 &&
      (d._portfolios || []).some((p) => f.portfolios.has(p)) === false) return false;
  if (f.products.size > 0 &&
      (d._products || []).some((p) => f.products.has(p.family)) === false) return false;

  if (f.states.size > 0) {
    const states = [];
    if (d.hq && d.hq.state) states.push(d.hq.state);
    (d.units || []).forEach((u) => { if (u.state) states.push(u.state); });
    if (states.some((s) => f.states.has(s)) === false) return false;
  }

  if (f.cities.size > 0) {
    const cities = [];
    if (d.hq && d.hq.city) cities.push(d.hq.city);
    (d.units || []).forEach((u) => { if (u.city) cities.push(u.city); });
    if (cities.some((c) => f.cities.has(c)) === false) return false;
  }

  return true;
}

function filteredDepartments(filters) {
  return DATA.departments.filter((d) => deptMatchesFilters(d, filters) && matches(d._hay));
}

function filteredRoles(filters) {
  return ROLES.filter((r) => {
    const dept = DATA.departments.find((d) => d.id === r.deptId);
    if (dept === undefined) return false;
    if (deptMatchesFilters(dept, filters) === false) return false;
    return matches(r.hay);
  });
}

function filteredPlaces(filters) {
  const f = filters || state.filters;
  const out = [];

  PLACES.forEach((st) => {
    if (f.states.size > 0 && f.states.has(st.state) === false) return;

    const cities = [];
    st.cities.forEach((ci) => {
      if (f.cities.size > 0 && f.cities.has(ci.city) === false) return;

      const units = ci.units.filter((u) => {
        const dept = DATA.departments.find((d) => d.id === u.deptId);
        if (dept === undefined) return false;
        if (deptMatchesFilters(dept, f) === false) return false;
        return matches(u.hay);
      });

      if (units.length > 0) cities.push({ city: ci.city, units: units });
    });

    if (cities.length > 0) out.push({ state: st.state, cities: cities });
  });

  return out;
}

/* Cities are only offered once a state is picked, otherwise the panel becomes
   a wall of 60-odd pills that nobody reads. */
function cityOptionsForFilters(f) {
  if (f.states.size === 0) return [];
  const opts = [];
  f.states.forEach((st) => {
    (CITIES_BY_STATE[st] || []).forEach((c) => { if (opts.indexOf(c) === -1) opts.push(c); });
  });
  return opts.sort((a, b) => a.localeCompare(b));
}

/* Capability areas narrow to whatever broad category is selected, so picking
   "Private industry" leaves only the nine areas that exist inside it. */
function clusterOptionsForFilters(f) {
  if (f.ownership.size === 0) return CLUSTERS;
  const opts = [];
  DATA.departments.forEach((d) => {
    if (f.ownership.has(d._ownership) && opts.indexOf(d.cluster) === -1) opts.push(d.cluster);
  });
  return CLUSTERS.filter((c) => opts.indexOf(c) !== -1);
}

/* Product families, narrowed by portfolio when one is picked. */
function productOptionsForFilters(f) {
  const counts = {};
  DATA.departments.forEach((d) => {
    (d._products || []).forEach((p) => {
      if (f.portfolios.size > 0 && f.portfolios.has(p.portfolio) === false) return;
      counts[p.family] = (counts[p.family] || 0) + 1;
    });
  });
  return Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b));
}

/* How many accounts each option would leave, measured against every other
   active facet but ignoring this facet's own selections, which is what makes
   the numbers useful while choosing. */
function facetCounts(facet, target, options) {
  const probe = cloneFilters(target);
  if (probe[facet] instanceof Set) probe[facet] = new Set();
  const base = DATA.departments.filter((d) => deptMatchesFilters(d, probe) && matches(d._hay));
  const out = {};
  options.forEach((opt) => {
    const v = String(opt);
    out[v] = base.filter((d) => {
      if (facet === "ownership") return d._ownership === v;
      if (facet === "clusters") return d.cluster === v;
      if (facet === "tags") return d.tags.indexOf(v) !== -1;
      if (facet === "portfolios") return (d._portfolios || []).indexOf(v) !== -1;
      if (facet === "products") return (d._products || []).some((p) => p.family === v);
      if (facet === "states") {
        return (d.hq && d.hq.state === v) || (d.units || []).some((u) => u.state === v);
      }
      if (facet === "cities") {
        return (d.hq && d.hq.city === v) || (d.units || []).some((u) => u.city === v);
      }
      return false;
    }).length;
  });
  return out;
}

/* Drops selections that the parent facet has just made unreachable, otherwise
   a stale child silently filters everything down to nothing. */
function pruneFilters(target) {
  const clusters = clusterOptionsForFilters(target);
  Array.from(target.clusters).forEach((c) => {
    if (clusters.indexOf(c) === -1) target.clusters.delete(c);
  });
  const prods = productOptionsForFilters(target);
  Array.from(target.products).forEach((p) => {
    if (prods.indexOf(p) === -1) target.products.delete(p);
  });
  const cities = cityOptionsForFilters(target);
  Array.from(target.cities).forEach((c) => {
    if (cities.indexOf(c) === -1) target.cities.delete(c);
  });
}

function toggleFacet(facet, value, target) {
  if (facet === "onlyMarked") {
    target.onlyMarked = target.onlyMarked !== true;
    return;
  }
  const set = target[facet];
  if (set instanceof Set === false) return;
  if (set.has(value)) set.delete(value);
  else set.add(value);

  /* Deselecting a state must drop any of its cities, or an invisible city
     filter keeps narrowing the results. */
  if (facet === "states") {
    const allowed = cityOptionsForFilters(target);
    Array.from(target.cities).forEach((c) => {
      if (allowed.indexOf(c) === -1) target.cities.delete(c);
    });
  }
}

function removeFilter(facet, value) {
  if (facet === "onlyMarked") {
    state.filters.onlyMarked = false;
    return;
  }
  const set = state.filters[facet];
  if (set instanceof Set) set.delete(value);
}

function clearAllFilters() {
  state.filters = emptyFilters();
  state.draftFilters = emptyFilters();
}

/* ============================ filter UI ============================ */

function renderFacetButtons(facet, options, target, opts) {
  const o = opts || {};
  const counts = o.counts;
  let html = "";
  options.forEach((opt) => {
    const val = String(opt);
    let pressed = false;
    if (facet === "onlyMarked") pressed = target.onlyMarked === true;
    else if (target[facet] instanceof Set) pressed = target[facet].has(val);
    const label = o.getLabel ? o.getLabel(opt) : val;
    const n = counts ? counts[val] : undefined;
    const dead = n === 0 && pressed === false;

    html += '<button class="fopt' + (dead ? " fopt--empty" : "") + '" type="button" data-facet="' + esc(facet) + '"';
    if (facet !== "onlyMarked") html += ' data-value="' + esc(val) + '"';
    if (o.hue) html += ' style="--fo:' + esc(o.hue(opt)) + '"';
    html += ' aria-pressed="' + (pressed ? "true" : "false") + '">';
    if (o.hue) html += '<i class="fopt__dot"></i>';
    html += esc(label);
    if (n !== undefined) html += '<b class="fopt__n">' + n + "</b>";
    html += "</button>";
  });
  return html;
}

function renderFacetGroups(target) {
  const clusters = clusterOptionsForFilters(target);
  const products = productOptionsForFilters(target);
  const cities = cityOptionsForFilters(target);
  let html = "";

  /* 1. Broad category first, with capability areas nested beneath it. */
  html += '<div class="facet"><div class="facet__h">Broad category</div>' +
    '<p class="facet__hint">Start here, then narrow to a capability area.</p><div class="facet__opts">';
  html += renderFacetButtons("ownership", OWNERSHIP_ORDER, target, {
    counts: facetCounts("ownership", target, OWNERSHIP_ORDER),
    hue: (o) => (OWNERSHIP_STYLE[o] ? OWNERSHIP_STYLE[o].hue : "#888")
  });
  html += "</div>";
  html += '<div class="facet__sub"><div class="facet__h">Capability area' +
    (target.ownership.size > 0 ? " in " + esc(Array.from(target.ownership).join(", ")) : "") +
    '</div><div class="facet__opts">' +
    renderFacetButtons("clusters", clusters, target, {
      counts: facetCounts("clusters", target, clusters),
      hue: (c) => clusterHue(c)
    }) + "</div></div>";
  html += "</div>";

  /* 2. What you would sell. */
  html += '<div class="facet"><div class="facet__h">Autodesk portfolio</div>' +
    '<p class="facet__hint">Find accounts where a portfolio or a specific product already fits.</p>' +
    '<div class="facet__opts">';
  html += renderFacetButtons("portfolios", PORTFOLIO_ORDER, target, {
    counts: facetCounts("portfolios", target, PORTFOLIO_ORDER),
    getLabel: (p) => (PORTFOLIO_STYLE[p] ? PORTFOLIO_STYLE[p].label : p),
    hue: (p) => (PORTFOLIO_STYLE[p] ? PORTFOLIO_STYLE[p].hue : "#888")
  });
  html += "</div>";
  html += '<div class="facet__sub"><div class="facet__h">Product family</div><div class="facet__opts">' +
    renderFacetButtons("products", products, target, {
      counts: facetCounts("products", target, products)
    }) + "</div></div>";
  html += "</div>";

  /* 3. Where they are. */
  html += '<div class="facet"><div class="facet__h">Location</div><div class="facet__opts">';
  html += renderFacetButtons("states", ALL_STATES, target, {
    counts: facetCounts("states", target, ALL_STATES)
  });
  html += "</div>";
  if (cities.length > 0) {
    html += '<div class="facet__sub"><div class="facet__h">Narrow to a city</div><div class="facet__opts">' +
      renderFacetButtons("cities", cities, target, {
        counts: facetCounts("cities", target, cities)
      }) + "</div></div>";
  }
  html += "</div>";

  html += '<div class="facet"><div class="facet__h">Focus area</div><div class="facet__opts">';
  html += renderFacetButtons("tags", ALL_TAGS, target, {
    counts: facetCounts("tags", target, ALL_TAGS)
  });
  html += "</div></div>";

  html += '<div class="facet"><div class="facet__h">My targets</div><div class="facet__opts">';
  html += renderFacetButtons("onlyMarked", ["onlyMarked"], target, {
    getLabel: () => "Saved only (" + state.marks.size + ")"
  });
  html += "</div></div>";

  return html;
}

function renderFilterButton() {
  if (FILTERABLE[state.view] !== true) return "";
  const n = filterCount(state.filters);
  return '<button class="filterbtn" type="button" data-filter-open="1" aria-expanded="' +
    (state.filtersOpen ? "true" : "false") + '">Filters' +
    (n > 0 ? '<span class="filterbtn__badge">' + n + "</span>" : "") +
    "</button>";
}

function draftSummary() {
  const f = state.draftFilters;
  if (state.view === "places") {
    const n = filteredPlaces(f).reduce((a, st) => a + st.cities.reduce((b, c) => b + c.units.length, 0), 0);
    return "Show " + n + " locations";
  }
  if (state.view === "roles") {
    return "Show " + filteredRoles(f).length + " roles";
  }
  if (state.view === "map") {
    return "Show " + filteredDepartments(f).length + " of " + DATA.departments.length + " organisations";
  }
  return "Show " + filteredDepartments(f).length + " of " + DATA.departments.length + " organisations";
}

function renderFilterSheet() {
  return '<div class="sheetbackdrop" data-filter-close="backdrop"></div>' +
    '<div class="sheet" role="dialog" aria-modal="true" aria-label="Filters">' +
    '<div class="sheet__handle" aria-hidden="true"></div>' +
    '<div class="sheet__head"><h2>Filters</h2>' +
    '<button class="sheet__x" type="button" data-filter-close="1" aria-label="Close filters">&times;</button></div>' +
    '<div class="sheet__body">' + renderFacetGroups(state.draftFilters) + "</div>" +
    '<div class="sheet__foot">' +
    '<button class="btn-secondary" type="button" data-filter-clear="1">Clear</button>' +
    '<button class="btn-primary" type="button" data-filter-apply="1">' + esc(draftSummary()) + "</button>" +
    "</div></div>";
}

function renderActiveFilters() {
  const f = state.filters;
  if (FILTERABLE[state.view] !== true || filterCount(f) === 0) return "";

  let html = '<div class="actfilters" role="group" aria-label="Active filters">';

  if (f.onlyMarked === true) {
    html += '<span class="actf">Saved only<button type="button" data-rm-filter="onlyMarked" aria-label="Remove saved filter">&times;</button></span>';
  }

  /* Chips read broad to narrow so the active drill-down is obvious at a glance. */
  function chips(facet, values, label, hue) {
    values.forEach((v) => {
      html += '<span class="actf' + (hue ? " actf--dot" : "") + '"' +
        (hue ? ' style="--fo:' + esc(hue(v)) + '"' : "") + ">" +
        (hue ? '<i class="fopt__dot"></i>' : "") + esc(label ? label(v) : v) +
        '<button type="button" data-rm-filter="' + facet + '" data-value="' + esc(v) +
        '" aria-label="Remove ' + esc(label ? label(v) : v) + '">&times;</button></span>';
    });
  }

  chips("ownership", Array.from(f.ownership), null, (o) =>
    (OWNERSHIP_STYLE[o] ? OWNERSHIP_STYLE[o].hue : "#888"));
  chips("clusters", Array.from(f.clusters), null, (c) => clusterHue(c));
  chips("portfolios", Array.from(f.portfolios),
    (p) => (PORTFOLIO_STYLE[p] ? PORTFOLIO_STYLE[p].label : p),
    (p) => (PORTFOLIO_STYLE[p] ? PORTFOLIO_STYLE[p].hue : "#888"));
  chips("products", Array.from(f.products));
  chips("states", Array.from(f.states));
  chips("cities", Array.from(f.cities));
  chips("tags", Array.from(f.tags));

  html += '<button class="clearall" type="button" data-clear-filters="1">Clear all</button></div>';
  return html;
}

function renderBreadcrumb(d) {
  if (Array.isArray(d.path) === false || d.path.length === 0) return "";
  /* The card title already names the organisation, so a trailing segment that
     repeats it is dropped rather than shown twice. */
  const segs = d.path.filter((seg, i) => !(i === d.path.length - 1 && seg === d.name));
  if (segs.length === 0) return "";

  let html = '<div class="crumb">';
  segs.forEach((seg, i) => {
    if (i > 0) html += '<span class="sep">\u203a</span>';
    html += "<span>" + hl(seg) + "</span>";
  });
  return html + "</div>";
}

function renderUnits(dept) {
  const units = Array.isArray(dept.units) ? dept.units : [];
  if (units.length === 0) return "";
  let html = '<ul class="unitlist">';
  units.forEach((u) => {
    html += "<li><b>" + hl(u.n) + "</b>";
    const loc = [u.city, u.state].filter(Boolean).join(", ");
    if (loc !== "") html += '<span class="loc">' + hl(loc) + "</span>";
    if (u.approx) html += '<span class="approx">location approximate</span>';
    html += "</li>";
  });
  return html + "</ul>";
}

const MAX_TREE_DEPTH = 3;

function renderPersonaTree(dept) {
  const roots = dept.personas.filter((p) => p.parent === null || p.parent === undefined || p.parent === "");

  function entry(p, depth) {
    const cls = depth <= 1 ? "persona--flat" : "persona--d" + Math.min(depth, MAX_TREE_DEPTH);
    const chain = personaChain(dept, p);
    let html = '<li><div class="persona ' + cls + '">';
    html += '<div class="persona__t">' + hl(p.t) +
      '<span class="lvlbadge">' + esc(LVL_LABELS[p.lvl] || ("L" + p.lvl)) + "</span></div>";
    if (chain !== "") html += '<div class="chain">' + hl(chain) + "</div>";
    html += '<div class="persona__d"><b>Cares about:</b> ' + hl(p.cares) + "<br>" +
      "<b>Measured on:</b> " + hl(p.measured) + "</div></div>";
    return html;
  }

  const kidsOf = (p) => dept.personas.filter((x) => x.parent === p.id);

  function renderNode(p, depth) {
    let html = entry(p, depth);
    const kids = kidsOf(p);

    if (kids.length > 0) {
      if (depth < MAX_TREE_DEPTH) {
        html += '<ul class="ptree">';
        kids.forEach((k) => { html += renderNode(k, depth + 1); });
        html += "</ul>";
      } else {
        /* Past three levels the indent squeezes the text on a phone, so deeper
           reports are listed flat and their "reports to" line carries the shape. */
        const queue = kids.slice();
        html += "</li>";
        while (queue.length > 0) {
          const next = queue.shift();
          html += entry(next, MAX_TREE_DEPTH) + "</li>";
          kidsOf(next).forEach((k) => queue.push(k));
        }
        return html;
      }
    }
    return html + "</li>";
  }

  let html = '<ul class="ptree">';
  roots.forEach((p) => { html += renderNode(p, 1); });
  return html + "</ul>";
}
