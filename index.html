const DEPT_SORTS = [
  { id: "name", label: "A\u2013Z" },
  { id: "usecases", label: "Use cases" },
  { id: "products", label: "Products" },
  { id: "locations", label: "Locations" },
  { id: "roles", label: "Roles" },
  { id: "breadth", label: "Portfolio breadth" }
];

function deptSort(list) {
  const s = state.dsort;
  const out = list.slice();
  const byName = (a, b) => a.name.localeCompare(b.name);
  if (s === "usecases") out.sort((a, b) => b._useCases - a._useCases || byName(a, b));
  else if (s === "products") out.sort((a, b) => b._products.length - a._products.length || byName(a, b));
  else if (s === "locations") out.sort((a, b) => (b._unitCount || 0) - (a._unitCount || 0) || byName(a, b));
  else if (s === "roles") out.sort((a, b) => b.personas.length - a.personas.length || byName(a, b));
  else if (s === "breadth") {
    out.sort((a, b) => b._portfolios.length - a._portfolios.length ||
      b._useCases - a._useCases || byName(a, b));
  } else out.sort(byName);
  return out;
}

function viewDepartments() {
  const list = filteredDepartments();
  const searching = state.query.trim().length >= 2;
  /* A broad search would otherwise expand every match at once and produce a
     page tens of screens long. */
  const autoOpen = searching && list.length <= 3;

  let html = head("Accounts to qualify",
    "Decide who is worth your time. Every row carries the reason to engage now, how big the account is and which Autodesk portfolios actually land. Open a row for the full meeting brief.");
  html += renderFilterBar();

  /* Outcome strip: what this page is for and what is in scope right now. */
  const units = list.reduce((n, d) => n + (d._unitCount || 0), 0);
  const roles = list.reduce((n, d) => n + d.personas.length, 0);
  const uses = list.reduce((n, d) => n + d._useCases, 0);
  const marked = list.filter((d) => state.marks.has(d.id)).length;
  html += '<div class="dstrip">' +
    '<div class="dstrip__s"><b>' + list.length + "</b><span>Accounts in scope</span></div>" +
    '<div class="dstrip__s"><b>' + units + "</b><span>Locations</span></div>" +
    '<div class="dstrip__s"><b>' + roles + "</b><span>Mapped roles</span></div>" +
    '<div class="dstrip__s"><b>' + uses + "</b><span>Documented use cases</span></div>" +
    '<div class="dstrip__s dstrip__s--mark"><b>' + marked + "</b><span>Saved targets</span></div>" +
    "</div>";

  html += '<div class="dbar">';
  html += '<span class="dbar__n">' + list.length + " of " + DATA.departments.length + " organisations</span>";
  html += '<span class="dbar__sort"><span class="dbar__lbl">Rank by</span>';
  DEPT_SORTS.forEach((s) => {
    html += '<button type="button" data-dsort="' + s.id + '" aria-pressed="' +
      (state.dsort === s.id ? "true" : "false") + '">' + esc(s.label) + "</button>";
  });
  html += "</span>";
  if (state.open.size > 0) {
    html += '<button class="linkbtn" type="button" data-collapse="1">Collapse all</button>';
  }
  html += "</div>";

  if (searching && autoOpen === false) {
    html += '<div class="searchhint">Open an organisation to see where the match sits.</div>';
  }

  if (list.length === 0) {
    return html + '<div class="empty">Nothing matches that. Try a shorter search, or clear the filters.</div>';
  }

  /* Ranked order is a flat list on purpose: grouping by cluster would fight the
     ranking. A-Z keeps the cluster grouping that makes browsing easier. */
  if (state.dsort === "name") {
    CLUSTERS.forEach((cluster) => {
      const group = deptSort(list.filter((d) => d.cluster === cluster));
      if (group.length === 0) return;
      html += '<div class="cluster" style="--cl:' + clusterHue(cluster) + '"><h2>' + esc(cluster) +
        '<span>' + group.length + "</span></h2></div>";
      group.forEach((d) => { html += cardDepartment(d, autoOpen); });
    });
  } else {
    const ranked = deptSort(list);
    html += '<div class="cluster cluster--rank"><h2>Ranked by ' +
      esc((DEPT_SORTS.find((s) => s.id === state.dsort) || {}).label || "") +
      '<span>' + ranked.length + "</span></h2></div>";
    ranked.forEach((d, i) => {
      html += '<div class="rankrow"><span class="rankrow__n">' + (i + 1) + "</span>" +
        cardDepartment(d, autoOpen) + "</div>";
    });
  }
  return html;
}

/* ============================ account map ============================ */

/* One hue per capability cluster so a ring carries information rather than
   repeating the parent category's colour 63 times. */
const CLUSTER_STYLE = {
  "Built assets and infrastructure": { hue: "#38BDF8", short: "Built assets" },
  "Sustainment, MRO and quality": { hue: "#22D3EE", short: "Sustainment" },
  "Platforms and manufacturing": { hue: "#F97316", short: "Platforms" },
  "Research and development (DRDO)": { hue: "#A78BFA", short: "R&D labs" },
  "Innovation ecosystem": { hue: "#34D399", short: "Innovation" },
  "Private industry and primes": { hue: "#F472B6", short: "Primes" },
  "Defence electronics and EW": { hue: "#60A5FA", short: "Electronics" },
  "Aerostructures and airframe modules": { hue: "#FBBF24", short: "Airframes" },
  "Precision engineering and materials": { hue: "#FB923C", short: "Precision" },
  "Optronics, UAV and autonomous systems": { hue: "#C084FC", short: "Optronics" },
  "Energetics, propulsion and land systems": { hue: "#F87171", short: "Energetics" },
  "Naval and shipbuilding ecosystem": { hue: "#2DD4BF", short: "Naval" },
  "Industrial, rail and facility infrastructure": { hue: "#94A3B8", short: "Industrial" },
  "Engineering services and design partners": { hue: "#A3E635", short: "Services" }
};

/* Above this many organisations a ring stops being readable, so the map
   inserts the capability-cluster level instead of listing every account. */
const BMAP_CLUSTER_THRESHOLD = 14;

/* The bubble currently hovered or focused, used to brighten its hub connector. */
let bmapHoverBubble = null;

function clusterHue(name) {
  const s = CLUSTER_STYLE[name];
  return s ? s.hue : "#94A3B8";
}
function clusterShort(name) {
  const s = CLUSTER_STYLE[name];
  return s ? s.short : name;
}

function bmapReset() {
  state.bmap = {
    level: "root", own: null, cluster: null, deptId: null,
    selected: null, sort: state.bmap ? state.bmap.sort : "name", prod: null
  };
  bmapHideTip();
  bmapHoverBubble = null;
}

function bmapMobile() {
  return window.innerWidth < 1024;
}

function bmapStageEstimateDim() {
  if (bmapMobile()) {
    const s = Math.min(window.innerWidth - 32, 640);
    return { w: s, h: s };
  }
  const h = Math.min(760, Math.max(460, window.innerHeight * 0.66));
  const w = Math.min(900, window.innerWidth - 700);
  return { w: w, h: h };
}

function bmapStageEstimateScale() {
  const dim = bmapStageEstimateDim();
  const base = bmapMobile() ? 360 : 620;
  return Math.min(1.3, Math.max(0.8, Math.min(dim.w, dim.h) / base));
}

function bmapHubSize() {
  return Math.round((bmapMobile() ? 82 : 132) * bmapStageEstimateScale());
}

function bmapCrowdFactor(count) {
  const n = typeof count === "number" && count > 0 ? count : 8;
  if (n <= 8) return 1;
  return Math.max(0.55, Math.sqrt(9 / n));
}

function bmapBubbleSize(weight, maxW, count) {
  const mob = bmapMobile();
  const scale = bmapStageEstimateScale() * bmapCrowdFactor(count);
  /* A smaller ceiling on narrow screens is counter-intuitively more legible:
     the ring radius is what is left after reserving room for the biggest
     bubble, so shrinking the ceiling widens the ring and the gap between
     neighbours, which is what the label actually needs. */
  const maxD = Math.max(58, Math.round((mob ? 100 : 190) * scale));
  /* Floor held close to the ceiling so the smallest bubble still fits a long
     acronym. Weight is signalled by size, but not at the cost of readability. */
  const minD = Math.max(
    Math.max(44, Math.round((mob ? 58 : 88) * scale)),
    Math.round(maxD * (mob ? 0.82 : 0.66))
  );
  const ratio = maxW > 0 ? weight / maxW : 1;
  return Math.round(minD + ratio * (maxD - minD));
}

/* Sizes the label so the longest single word fits on one line inside the
   circle, which is what stops "ELECTRONICS" breaking into "ELECTRONIC S". */
function bmapLabelFs(size, longestWord) {
  const longest = Math.max(2, longestWord || 6);
  /* Usable width is the circle minus its padding, and uppercase glyphs with
     letter-spacing run about 0.70em wide, not the 0.5em a lowercase guess gives. */
  const usable = Math.max(18, (size - 16) * 0.94);
  const byWord = usable / (longest * 0.70);
  const byBubble = size * 0.155;
  return Math.max(7, Math.min(14, Math.min(byWord, byBubble))).toFixed(1) + "px";
}

function bmapLongestWord(label) {
  return String(label || "").split(/\s+/).reduce((m, w) => Math.max(m, w.length), 1);
}

function bmapGradient(hue) {
  return "radial-gradient(circle at 32% 26%,rgba(255,255,255,.85) 0%," + hue +
    " 42%,rgba(0,0,0,.86) 100%)";
}

/* ---------- scope ---------- */

/* The set of accounts the current drill position points at, with the product
   filter applied. Everything on screen is driven from this. */
function bmapScope() {
  let list = filteredDepartments();
  if (state.bmap.own) list = list.filter((d) => d._ownership === state.bmap.own);
  if (state.bmap.cluster) list = list.filter((d) => d.cluster === state.bmap.cluster);
  if (state.bmap.deptId) list = list.filter((d) => d.id === state.bmap.deptId);
  if (state.bmap.prod) {
    list = list.filter((d) => d._products.some((p) => p.family === state.bmap.prod));
  }
  return list;
}

/* Scope ignoring the drill position, used for the product chips so their
   counts do not collapse to zero once a product is picked. */
function bmapScopeNoProd() {
  let list = filteredDepartments();
  if (state.bmap.own) list = list.filter((d) => d._ownership === state.bmap.own);
  if (state.bmap.cluster) list = list.filter((d) => d.cluster === state.bmap.cluster);
  return list;
}

function bmapOwnershipGroups(depts) {
  const map = {};
  depts.forEach((d) => {
    const own = d._ownership || "Other";
    if (map[own] === undefined) map[own] = { own: own, depts: [], units: 0 };
    map[own].depts.push(d);
    map[own].units += d._unitCount || 0;
  });
  return OWNERSHIP_ORDER.filter((o) => map[o] !== undefined).map((o) => map[o]);
}

function bmapClusterGroups(depts) {
  const map = {};
  const order = [];
  depts.forEach((d) => {
    const c = d.cluster || "Other";
    if (map[c] === undefined) { map[c] = { cluster: c, depts: [], units: 0 }; order.push(c); }
    map[c].depts.push(d);
    map[c].units += d._unitCount || 0;
  });
  return order.sort((a, b) => map[b].depts.length - map[a].depts.length).map((c) => map[c]);
}

/* Whether the current ownership category needs the extra cluster ring. */
function bmapUsesClusters(own) {
  if (!own) return false;
  const inOwn = filteredDepartments().filter((d) => d._ownership === own);
  if (inOwn.length <= BMAP_CLUSTER_THRESHOLD) return false;
  return bmapClusterGroups(inOwn).length > 1;
}

/* ---------- layout ---------- */

function bmapOrbitLayout(items) {
  const n = items.length;
  if (n === 0) return [];
  const maxW = Math.max.apply(null, items.map((i) => i.weight));
  const sizes = items.map((i) => bmapBubbleSize(i.weight, maxW, n));
  /* A narrow screen has no radial room for a second ring, so keep more items
     on one ring there and let the chord shrink them instead. */
  const perRing = bmapMobile() ? 10 : 11;
  const ringCount = Math.min(3, Math.max(1, Math.ceil(n / perRing)));
  const innerFrac = 0.44;
  const out = [];
  let placed = 0;

  for (let r = 0; r < ringCount; r += 1) {
    const ringsLeft = ringCount - r;
    const count = Math.ceil((n - placed) / ringsLeft);
    const rFrac = ringCount === 1 ? 1 : innerFrac + (1 - innerFrac) * (r / (ringCount - 1));
    const stagger = r % 2 === 1 ? 180 / count : 0;
    for (let i = 0; i < count; i += 1) {
      const idx = placed + i;
      out.push({
        item: items[idx], size: sizes[idx],
        angle: -90 + stagger + i * 360 / count, rFrac: rFrac, i: idx
      });
    }
    placed += count;
  }
  return out;
}

function bmapSearchDim(hay) {
  const q = state.query.trim();
  return q.length >= 2 && matches(hay) === false;
}

function bmapRenderBubble(node) {
  const dim = node.dim === true ? " bmap-bubble--dim" : "";
  const sel = node.sel === true ? " bmap-bubble--sel" : "";
  const titleAttr = node.title ? ' title="' + esc(node.title) + '"' : "";
  let attrs;
  if (node.hub === true) {
    const hubSize = bmapHubSize();
    attrs = ' class="bmap-bubble bmap-bubble--hub' + sel + '" type="button" style="left:50%;top:50%;width:' +
      hubSize + "px;height:" + hubSize + 'px;"';
  } else {
    const lw = bmapLongestWord(node.label);
    attrs = ' class="bmap-bubble' + dim + sel + '" type="button" data-angle="' + node.angle +
      '" data-rfrac="' + node.rFrac + '" data-lw="' + lw + '" style="left:50%;top:50%;width:' + node.size +
      "px;height:" + node.size + "px;--bmap-fs:" + bmapLabelFs(node.size, lw) +
      ";background:" + bmapGradient(node.hue) + ";--bmap-glow:" + node.hue +
      "99;animation-delay:" + (node.i * 0.03) + 's"';
  }
  if (node.ownAttr) attrs += ' data-bmap-own="' + esc(node.ownAttr) + '"';
  if (node.clusterAttr) attrs += ' data-bmap-cluster="' + esc(node.clusterAttr) + '"';
  if (node.deptAttr) attrs += ' data-bmap-dept="' + esc(node.deptAttr) + '"';
  if (node.prodAttr) attrs += ' data-bmap-prod="' + esc(node.prodAttr) + '"';
  attrs += ' aria-label="' + esc(node.aria) + '"' + titleAttr;
  let inner = '<span class="bmap-bubble__label">' + esc(node.label) + "</span>";
  if (node.sub) inner += '<span class="bmap-bubble__sub">' + esc(node.sub) + "</span>";
  return "<button" + attrs + ">" + inner + "</button>";
}

/* Positions bubbles and, critically, caps their diameter to the space actually
   available on their ring. Two bubbles on a ring of radius r with n members sit
   a chord of 2*r*sin(PI/n) apart, so nothing may exceed that minus a gap. The
   innermost ring is also kept clear of the hub. */
function bmapPosition() {
  const stage = document.querySelector(".bmap-stage");
  if (stage === null) return;
  const w = stage.clientWidth;
  const h = stage.clientHeight;
  if (w === 0 || h === 0) return;

  const bubbles = Array.prototype.slice.call(
    stage.querySelectorAll(".bmap-bubble:not(.bmap-bubble--hub)"));
  const hub = stage.querySelector(".bmap-bubble--hub");
  const hubR = hub ? (parseFloat(hub.style.width) || bmapHubSize()) / 2 : bmapHubSize() / 2;
  const cx = w / 2;
  const cy = h / 2;
  const pad = 10;
  const gap = 10;

  /* Natural size each bubble asked for, kept so re-layout is not cumulative. */
  bubbles.forEach((b) => {
    if (!b.dataset.baseSize) b.dataset.baseSize = String(parseFloat(b.style.width) || 60);
  });

  const rings = {};
  bubbles.forEach((b) => {
    const f = b.getAttribute("data-rfrac") || "1";
    if (!rings[f]) rings[f] = [];
    rings[f].push(b);
  });

  let maxAll = 0;
  bubbles.forEach((b) => {
    const s = parseFloat(b.dataset.baseSize);
    if (s > maxAll) maxAll = s;
  });

  const baseRx = w / 2 - pad;
  const baseRy = h / 2 - pad;
  const positions = [];

  /* Rings are laid out between the edge of the hub and the edge of the stage
     rather than at fixed fractions, otherwise an inner ring can land on top of
     the hub and hide its bubbles entirely. */
  const fracs = Object.keys(rings).sort((a, b) => parseFloat(a) - parseFloat(b));
  const k = fracs.length;
  const outerRx = baseRx - maxAll / 2;
  const outerRy = baseRy - maxAll / 2;
  const outerR = Math.min(outerRx, outerRy);
  const innerR = Math.min(outerR * 0.92, hubR + gap + maxAll / 2);

  fracs.forEach((f, ri) => {
    const list = rings[f];
    const n = list.length;
    const t = k === 1 ? 1 : ri / (k - 1);
    const rEff = k === 1 ? outerR : innerR + (outerR - innerR) * t;
    const scaleR = outerR > 0 ? rEff / outerR : 1;

    /* Three independent limits: the chord to the neighbour on the same ring,
       the clearance to the hub, and the radial gap to the adjacent ring. */
    let cap = n > 1 ? 2 * rEff * Math.sin(Math.PI / n) - gap : outerR;
    cap = Math.min(cap, 2 * (rEff - hubR - gap));
    if (k > 1) cap = Math.min(cap, (outerR - innerR) / (k - 1) - gap);
    cap = Math.max(30, cap);

    let ringMax = 0;
    list.forEach((b) => {
      const s = parseFloat(b.dataset.baseSize);
      if (s > ringMax) ringMax = s;
    });
    const shrink = ringMax > cap ? cap / ringMax : 1;

    list.forEach((b) => {
      const size = Math.round(parseFloat(b.dataset.baseSize) * shrink);
      b.style.width = size + "px";
      b.style.height = size + "px";
      b.style.setProperty("--bmap-fs", bmapLabelFs(size, parseInt(b.getAttribute("data-lw"), 10)));

      const angle = parseFloat(b.getAttribute("data-angle")) * Math.PI / 180;
      if (Number.isNaN(angle)) return;
      const x = cx + Math.cos(angle) * outerRx * scaleR;
      const y = cy + Math.sin(angle) * outerRy * scaleR;
      b.style.left = x + "px";
      b.style.top = y + "px";
      positions.push({ x: x, y: y, el: b });
    });
  });

  const caption = stage.querySelector(".bmap-hub-caption");
  if (caption !== null && hub !== null) caption.style.top = (cy + hubR + 8) + "px";

  bmapDrawSvg(stage, w, h, cx, cy, baseRx, baseRy, positions);
}

function bmapDrawSvg(stage, w, h, cx, cy, rx, ry, positions) {
  let svg = stage.querySelector(".bmap-svg");
  if (svg === null) {
    svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "bmap-svg");
    svg.setAttribute("aria-hidden", "true");
    stage.insertBefore(svg, stage.firstChild);
  }
  svg.setAttribute("viewBox", "0 0 " + w + " " + h);
  svg.innerHTML = "";

  const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
  for (let ri = 0; ri < 3; ri += 1) {
    const grad = document.createElementNS("http://www.w3.org/2000/svg", "linearGradient");
    grad.setAttribute("id", "bmapRingGrad" + ri);
    grad.setAttribute("x1", "0%"); grad.setAttribute("y1", "0%");
    grad.setAttribute("x2", "100%"); grad.setAttribute("y2", "100%");
    const s1 = document.createElementNS("http://www.w3.org/2000/svg", "stop");
    s1.setAttribute("offset", "0%"); s1.setAttribute("stop-color", "rgba(59,130,246,.45)");
    const s2 = document.createElementNS("http://www.w3.org/2000/svg", "stop");
    s2.setAttribute("offset", "100%"); s2.setAttribute("stop-color", "rgba(242,81,10,.28)");
    grad.appendChild(s1); grad.appendChild(s2);
    defs.appendChild(grad);
  }
  svg.appendChild(defs);

  [0.6, 0.82, 0.98].forEach((frac, ri) => {
    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("cx", String(cx));
    c.setAttribute("cy", String(cy));
    c.setAttribute("r", String(Math.min(rx, ry) * frac));
    c.setAttribute("class", "bmap-ring bmap-ring--" + (ri + 1));
    c.setAttribute("fill", "none");
    c.setAttribute("stroke", "url(#bmapRingGrad" + ri + ")");
    c.setAttribute("stroke-width", "1");
    c.setAttribute("stroke-dasharray", ri === 0 ? "8 12" : ri === 1 ? "6 10" : "4 8");
    svg.appendChild(c);
  });

  positions.forEach((p) => {
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", String(cx));
    line.setAttribute("y1", String(cy));
    line.setAttribute("x2", String(p.x));
    line.setAttribute("y2", String(p.y));
    line.setAttribute("class", "bmap-link" +
      (p.el.classList.contains("bmap-bubble--sel") || p.el === bmapHoverBubble ? " bmap-link--active" : ""));
    svg.appendChild(line);
  });
}

/* ---------- tooltip ---------- */

function bmapEnsureTip() {
  let tip = document.getElementById("bmapTip");
  if (tip === null) {
    tip = document.createElement("div");
    tip.id = "bmapTip";
    tip.className = "bmap-tip";
    tip.hidden = true;
    document.body.appendChild(tip);
  }
  return tip;
}

function bmapHideTip() {
  const tip = document.getElementById("bmapTip");
  if (tip !== null) tip.hidden = true;
}

function bmapShowTip(bubble, clientX, clientY) {
  if (state.view !== "map") return;
  const html = bmapTipHtml(bubble);
  if (html === "") return;
  const tip = bmapEnsureTip();
  tip.innerHTML = html;
  tip.hidden = false;
  const pad = 12;
  let left = clientX + pad;
  let top = clientY + pad;
  tip.style.left = left + "px";
  tip.style.top = top + "px";
  const rect = tip.getBoundingClientRect();
  if (rect.right > window.innerWidth - 8) left = clientX - rect.width - pad;
  if (rect.bottom > window.innerHeight - 8) top = clientY - rect.height - pad;
  tip.style.left = Math.max(8, left) + "px";
  tip.style.top = Math.max(8, top) + "px";
}

function bmapTipHtml(bubble) {
  const ownAttr = bubble.getAttribute("data-bmap-own");
  const clusterAttr = bubble.getAttribute("data-bmap-cluster");
  const deptAttr = bubble.getAttribute("data-bmap-dept");
  const prodAttr = bubble.getAttribute("data-bmap-prod");

  if (deptAttr) {
    const d = DATA.departments.find((x) => x.id === deptAttr);
    if (d === undefined) return "";
    const hq = d.units && d.units[0] ? d.units[0].city + ", " + d.units[0].state : "\u2014";
    const prods = d._products.slice(0, 4).map((p) =>
      '<span class="bmap-tip__prod">' + esc(p.family) + "</span>").join("");
    const what = d.what.length > 130 ? d.what.slice(0, 127) + "\u2026" : d.what;
    return '<div class="bmap-tip__t">' + esc(d.name) + "</div>" +
      '<div class="bmap-tip__badge">' + esc(d.acr) + " \u00b7 " + esc(clusterShort(d.cluster)) + "</div>" +
      '<div class="bmap-tip__row">HQ ' + esc(hq) + " \u00b7 " + (d._unitCount || 0) + " locations \u00b7 " +
      (d.personas ? d.personas.length : 0) + " roles</div>" +
      (prods ? '<div class="bmap-tip__prods">' + prods + "</div>" : "") +
      '<div class="bmap-tip__row" style="margin-top:8px">' + esc(what) + "</div>" +
      '<div class="bmap-tip__row" style="margin-top:6px;color:rgba(255,255,255,.4)">Click to open product fit</div>';
  }

  if (clusterAttr) {
    const grp = bmapClusterGroups(bmapScopeNoProd()).find((g) => g.cluster === clusterAttr);
    if (grp === undefined) return "";
    return '<div class="bmap-tip__t">' + esc(clusterAttr) + "</div>" +
      '<div class="bmap-tip__row">' + grp.depts.length + " organisations \u00b7 " + grp.units + " locations</div>" +
      '<div class="bmap-tip__row" style="margin-top:6px">' +
      esc(grp.depts.slice(0, 10).map((d) => d.acr).join(", ") +
        (grp.depts.length > 10 ? " and " + (grp.depts.length - 10) + " more" : "")) + "</div>";
  }

  if (ownAttr) {
    const grp = bmapOwnershipGroups(filteredDepartments()).find((g) => g.own === ownAttr);
    if (grp === undefined) return "";
    const clusters = bmapClusterGroups(grp.depts);
    return '<div class="bmap-tip__t">' + esc(ownAttr) + "</div>" +
      '<div class="bmap-tip__row">' + grp.depts.length + " organisations \u00b7 " + grp.units +
      " locations \u00b7 " + clusters.length + " capability area" + (clusters.length === 1 ? "" : "s") + "</div>" +
      '<div class="bmap-tip__bars" style="margin-top:7px">' +
      clusters.slice(0, 6).map((c) =>
        '<div class="bmap-tip__bar" style="color:' + clusterHue(c.cluster) + '"><i></i>' +
        '<span style="color:rgba(255,255,255,.72)">' + esc(clusterShort(c.cluster)) +
        "</span><u>" + c.depts.length + "</u></div>").join("") + "</div>";
  }

  if (prodAttr && state.bmap.deptId) {
    const d = DATA.departments.find((x) => x.id === state.bmap.deptId);
    if (d === undefined) return "";
    const prod = d._products.find((p) => p.family === prodAttr);
    if (prod === undefined) return "";
    const port = PORTFOLIO_STYLE[prod.portfolio] ? PORTFOLIO_STYLE[prod.portfolio].label : prod.portfolio;
    const others = filteredDepartments().filter((od) =>
      od.id !== d.id && od._products.some((p) => p.family === prodAttr));
    return '<div class="bmap-tip__t">' + esc(prodAttr) + "</div>" +
      '<div class="bmap-tip__badge">' + esc(port) + "</div>" +
      '<div class="bmap-tip__row">' + prod.whys.length + " use case" + (prod.whys.length === 1 ? "" : "s") +
      " at " + esc(d.acr) + "</div>" +
      '<div class="bmap-tip__row">Also fits ' + others.length + " other account" +
      (others.length === 1 ? "" : "s") + "</div>";
  }

  if (bubble.classList.contains("bmap-bubble--hub")) {
    return '<div class="bmap-tip__t">All accounts</div>' +
      '<div class="bmap-tip__row">' + filteredDepartments().length +
      " in view \u2014 click a ring to drill in</div>";
  }
  return "";
}

/* Keeps the map and the list pointing at the same account: hovering either one
   lights up the other. Done by class toggle so no re-render is needed. */
function bmapSyncRow(bubble, on) {
  const id = bubble.getAttribute("data-bmap-dept");
  if (!id) return;
  const row = document.querySelector('[data-bmap-row="' + CSS.escape(id) + '"]');
  if (row !== null) row.classList.toggle("bmap-row--hot", on === true);
}

function bmapSyncBubble(id, on) {
  const b = document.querySelector('.bmap-bubble[data-bmap-dept="' + CSS.escape(id) + '"]');
  if (b === null) return;
  b.classList.toggle("bmap-bubble--hot", on === true);
  bmapHoverBubble = on === true ? b : null;
  bmapPosition();
}

/* ---------- navigation chrome ---------- */

function bmapCrumbHtml() {
  const parts = [];
  parts.push('<button class="bmap-crumb__b" type="button" data-bmap-root="1">All accounts</button>');
  if (state.bmap.own) {
    parts.push('<button class="bmap-crumb__b" type="button" data-bmap-goown="1">' +
      esc(state.bmap.own) + "</button>");
  }
  if (state.bmap.cluster) {
    parts.push('<button class="bmap-crumb__b" type="button" data-bmap-gocluster="1">' +
      esc(clusterShort(state.bmap.cluster)) + "</button>");
  }
  if (state.bmap.deptId) {
    const d = DATA.departments.find((x) => x.id === state.bmap.deptId);
    if (d !== undefined) parts.push('<span class="bmap-crumb__cur">' + esc(d.acr) + "</span>");
  }
  return '<nav class="bmap-crumb" aria-label="Map position">' +
    parts.join('<span class="sep">\u203a</span>') + "</nav>";
}

function bmapLegendHtml(items) {
  if (!items || items.length === 0) return "";
  let html = '<div class="bmap-legend">';
  items.forEach((it) => {
    html += '<span><i style="color:' + it.hue + '"></i>' + esc(it.label) + "</span>";
  });
  return html + "</div>";
}

/* ---------- account list ---------- */

const BMAP_SORTS = [
  { id: "name", label: "A\u2013Z" },
  { id: "locations", label: "Locations" },
  { id: "roles", label: "Roles" },
  { id: "products", label: "Products" }
];

function bmapSortDepts(list) {
  const s = state.bmap.sort;
  const out = list.slice();
  if (s === "locations") out.sort((a, b) => (b._unitCount || 0) - (a._unitCount || 0) || a.name.localeCompare(b.name));
  else if (s === "roles") out.sort((a, b) => (b.personas.length) - (a.personas.length) || a.name.localeCompare(b.name));
  else if (s === "products") out.sort((a, b) => (b._products.length) - (a._products.length) || a.name.localeCompare(b.name));
  else out.sort((a, b) => a.name.localeCompare(b.name));
  return out;
}

/* Product-fit chips: the families present in the current scope, so the list
   can be sliced down to "accounts where Inventor lands" in one click. */
function bmapProdChipsHtml() {
  const scope = bmapScopeNoProd();
  const counts = {};
  scope.forEach((d) => {
    d._products.forEach((p) => {
      if (counts[p.family] === undefined) counts[p.family] = { n: 0, portfolio: p.portfolio };
      counts[p.family].n += 1;
    });
  });
  const fams = Object.keys(counts).sort((a, b) => counts[b].n - counts[a].n).slice(0, 10);
  if (fams.length === 0) return "";

  let html = '<div class="bmap-prods"><span class="bmap-prods__lbl">Product fit</span>';
  html += '<button class="bmap-prod" type="button" data-bmap-prodfilter="__all" aria-pressed="' +
    (state.bmap.prod === null ? "true" : "false") + '">Any</button>';
  fams.forEach((f) => {
    const ps = PORTFOLIO_STYLE[counts[f].portfolio];
    html += '<button class="bmap-prod" type="button" data-bmap-prodfilter="' + esc(f) +
      '" aria-pressed="' + (state.bmap.prod === f ? "true" : "false") +
      '" style="--pf:' + (ps ? ps.hue : "#888") + '"><i></i>' + esc(f) + " <b>" + counts[f].n + "</b></button>";
  });
  return html + "</div>";
}

function bmapListHtml(list) {
  let html = '<div class="bmap-list">';
  html += '<div class="bmap-list__bar"><span class="bmap-list__n">' + list.length +
    " account" + (list.length === 1 ? "" : "s") + "</span><span class=\"bmap-list__sort\">";
  BMAP_SORTS.forEach((s) => {
    html += '<button type="button" data-bmap-sort="' + s.id + '" aria-pressed="' +
      (state.bmap.sort === s.id ? "true" : "false") + '">' + esc(s.label) + "</button>";
  });
  html += "</span></div>";

  if (list.length === 0) {
    return html + '<div class="bmap-list__empty">Nothing matches. Clear a filter or widen the search.</div></div>';
  }

  html += '<div class="bmap-list__rows">';
  list.forEach((d) => {
    const marked = state.marks.has(d.id);
    html += '<div class="bmap-row' + (state.bmap.deptId === d.id ? " bmap-row--sel" : "") +
      '" data-bmap-row="' + esc(d.id) + '">';
    html += '<button class="bmap-row__main" type="button" data-bmap-dept="' + esc(d.id) + '">';
    html += '<span class="bmap-row__dot" style="background:' + clusterHue(d.cluster) + '"></span>';
    html += '<span class="bmap-row__txt"><b>' + hl(d.acr) + "</b><span>" + hl(d.name) + "</span>" +
      '<em>' + esc(clusterShort(d.cluster)) + "</em></span>";
    html += '<span class="bmap-row__nums"><u>' + (d._unitCount || 0) + '<i>loc</i></u><u>' +
      d.personas.length + '<i>rol</i></u><u>' + d._products.length + "<i>prd</i></u></span>";
    html += "</button>";
    html += '<button class="bmap-row__mark' + (marked ? " on" : "") + '" type="button" data-mark="' +
      esc(d.id) + '" aria-pressed="' + (marked ? "true" : "false") +
      '" title="' + (marked ? "Remove from my targets" : "Save to my targets") +
      '" aria-label="' + (marked ? "Remove " : "Save ") + esc(d.acr) + ' to my targets">\u2605</button>';
    html += '<button class="bmap-row__go" type="button" data-jump="' + esc(d.id) +
      '" title="Open playbook" aria-label="Open ' + esc(d.acr) + ' playbook">\u2192</button>';
    html += "</div>";
  });
  return html + "</div></div>";
}

/* Compact summary of whatever the drill position points at. */
function bmapScopeHtml(list) {
  const lvl = state.bmap.level;
  let title = "All accounts";
  let meta = "Every organisation in view";
  let accent = "#F2510A";

  if (lvl === "own" && state.bmap.own) {
    title = state.bmap.own;
    accent = OWNERSHIP_STYLE[state.bmap.own] ? OWNERSHIP_STYLE[state.bmap.own].hue : accent;
    meta = bmapClusterGroups(bmapScopeNoProd()).length + " capability areas";
  }
  if (lvl === "cluster" && state.bmap.cluster) {
    title = state.bmap.cluster;
    accent = clusterHue(state.bmap.cluster);
    meta = state.bmap.own || "";
  }
  if (lvl === "dept" && state.bmap.deptId) {
    const d = DATA.departments.find((x) => x.id === state.bmap.deptId);
    if (d !== undefined) {
      title = d.name;
      accent = clusterHue(d.cluster);
      meta = d.acr + " \u00b7 " + d._ownership + " \u00b7 " + d.cluster;
    }
  }

  const units = list.reduce((n, d) => n + (d._unitCount || 0), 0);
  const roles = list.reduce((n, d) => n + d.personas.length, 0);
  const prods = {};
  list.forEach((d) => d._products.forEach((p) => { prods[p.family] = true; }));
  const marked = list.filter((d) => state.marks.has(d.id)).length;

  let html = '<div class="bmap-scope" style="--bmap-accent:' + esc(accent) + '">';
  html += '<div class="bmap-scope__t">' + hl(title) + "</div>";
  if (meta) html += '<div class="bmap-scope__m">' + esc(meta) + "</div>";
  html += '<div class="bmap-scope__stats">' +
    '<div><b>' + list.length + "</b><span>Accounts</span></div>" +
    '<div><b>' + units + "</b><span>Locations</span></div>" +
    '<div><b>' + roles + "</b><span>Roles</span></div>" +
    '<div><b>' + Object.keys(prods).length + "</b><span>Products</span></div>" +
    "</div>";
  if (marked > 0) {
    html += '<div class="bmap-scope__marked">\u2605 ' + marked + " saved to my targets in this view</div>";
  }

  /* At account level the detail that used to sit in a prose block. */
  if (lvl === "dept" && state.bmap.deptId) {
    const d = DATA.departments.find((x) => x.id === state.bmap.deptId);
    if (d !== undefined) {
      html += '<p class="bmap-scope__what">' + hl(d.what) + "</p>";
      if (state.bmap.selected && state.bmap.selected.type === "prod") {
        const prod = d._products.find((p) => p.family === state.bmap.selected.family);
        if (prod !== undefined) {
          html += '<div class="bmap-scope__why"><b>' + esc(prod.family) + "</b>" +
            prod.whys.map((w) => "<p>" + hl(w.why) + "</p>").join("") + "</div>";
        }
      }
      html += '<div class="bmap-scope__cta">' +
        '<button class="jump" type="button" data-jump="' + esc(d.id) + '">Open ' + esc(d.acr) + " playbook &rarr;</button>" +
        '<button class="bmap-scope__mk' + (state.marks.has(d.id) ? " on" : "") + '" type="button" data-mark="' +
        esc(d.id) + '">\u2605 ' + (state.marks.has(d.id) ? "Saved" : "Save target") + "</button></div>";
    }
  }
  return html + "</div>";
}

/* ---------- view ---------- */

function viewMap() {
  const all = filteredDepartments();
  let html = head("Account map",
    "Slice 86 defence accounts by ownership, capability area and Autodesk product fit. Save the ones that matter to your target list.");
  html += renderFilterBar();

  if (all.length === 0) {
    return html + '<div class="empty">Nothing matches that. Try clearing a filter or broadening your search.</div>';
  }

  /* Resolve the level from the drill state so back navigation cannot desync. */
  let lvl = "root";
  if (state.bmap.deptId) lvl = "dept";
  else if (state.bmap.cluster) lvl = "cluster";
  else if (state.bmap.own) lvl = "own";
  state.bmap.level = lvl;

  const scope = bmapScope();
  const listSource = lvl === "dept" ? bmapScopeNoProd().filter((d) => d.cluster ===
    (DATA.departments.find((x) => x.id === state.bmap.deptId) || {}).cluster) : scope;

  html += '<div class="bmap-wrap"><div class="bmap-console">';

  /* ----- left: the map ----- */
  html += '<div class="bmap-main">';
  html += '<div class="bmap-nav">';
  if (lvl !== "root") html += '<button class="bmap-back" type="button" data-bmap-back="1">&larr; Back</button>';
  html += bmapCrumbHtml();
  html += "</div>";

  let legend = [];
  let items = [];
  let hubLabel = "All";
  let hubSub = all.length + " accounts";
  let hubCaption = "India MoD and defence industry accounts";
  let hubTitle = "All accounts";

  if (lvl === "root") {
    const groups = bmapOwnershipGroups(all);
    legend = OWNERSHIP_ORDER.filter((o) => OWNERSHIP_STYLE[o])
      .map((o) => ({ hue: OWNERSHIP_STYLE[o].hue, label: o }));
    items = groups.map((g) => ({
      weight: g.depts.length,
      label: OWNERSHIP_STYLE[g.own] ? OWNERSHIP_STYLE[g.own].short : g.own,
      sub: g.depts.length + " orgs",
      title: g.own,
      hue: OWNERSHIP_STYLE[g.own] ? OWNERSHIP_STYLE[g.own].hue : "#888",
      ownAttr: g.own,
      aria: g.own + ", " + g.depts.length + " organisations",
      hay: (g.own + " " + g.depts.map((d) => d._hay).join(" ")).toLowerCase()
    }));
  } else if (lvl === "own" && bmapUsesClusters(state.bmap.own)) {
    const groups = bmapClusterGroups(bmapScopeNoProd());
    legend = groups.map((g) => ({ hue: clusterHue(g.cluster), label: clusterShort(g.cluster) }));
    hubLabel = OWNERSHIP_STYLE[state.bmap.own] ? OWNERSHIP_STYLE[state.bmap.own].short : state.bmap.own;
    hubSub = groups.length + " areas";
    hubCaption = state.bmap.own;
    hubTitle = state.bmap.own;
    items = groups.map((g) => ({
      weight: g.depts.length,
      label: clusterShort(g.cluster),
      sub: g.depts.length + " orgs",
      title: g.cluster,
      hue: clusterHue(g.cluster),
      clusterAttr: g.cluster,
      aria: g.cluster + ", " + g.depts.length + " organisations",
      hay: (g.cluster + " " + g.depts.map((d) => d._hay).join(" ")).toLowerCase()
    }));
  } else if (lvl === "own" || lvl === "cluster") {
    const src = bmapScope();
    legend = bmapClusterGroups(src).map((g) => ({ hue: clusterHue(g.cluster), label: clusterShort(g.cluster) }));
    if (lvl === "cluster") {
      hubLabel = clusterShort(state.bmap.cluster);
      hubCaption = state.bmap.cluster;
      hubTitle = state.bmap.cluster;
    } else {
      hubLabel = OWNERSHIP_STYLE[state.bmap.own] ? OWNERSHIP_STYLE[state.bmap.own].short : state.bmap.own;
      hubCaption = state.bmap.own;
      hubTitle = state.bmap.own;
    }
    hubSub = src.length + " orgs";
    items = src.map((d) => ({
      weight: Math.max(d._unitCount, 1) + d._products.length,
      label: d.acr,
      sub: (d._unitCount || 0) + " loc",
      title: d.name,
      hue: clusterHue(d.cluster),
      deptAttr: d.id,
      aria: d.name + ", " + d.acr,
      hay: d._hay
    }));
  } else if (lvl === "dept") {
    const d = DATA.departments.find((x) => x.id === state.bmap.deptId);
    if (d !== undefined) {
      hubLabel = d.acr;
      hubSub = d._products.length + " products";
      hubCaption = d.name;
      hubTitle = d.name;
      legend = Object.keys(PORTFOLIO_STYLE).map((k) => ({
        hue: PORTFOLIO_STYLE[k].hue, label: PORTFOLIO_STYLE[k].label
      }));
      items = d._products.map((p) => ({
        weight: p.whys.length + 1,
        label: p.family,
        sub: p.whys.length + (p.whys.length === 1 ? " use" : " uses"),
        title: p.family + " \u2014 fit for " + d.name,
        hue: PORTFOLIO_STYLE[p.portfolio] ? PORTFOLIO_STYLE[p.portfolio].hue : "#888",
        prodAttr: p.family,
        aria: p.family + " product fit for " + d.name,
        hay: (p.family + " " + d._hay).toLowerCase()
      }));
    }
  }

  html += bmapLegendHtml(legend);
  html += '<div class="bmap-stage">';
  html += bmapRenderBubble({
    hub: true, label: hubLabel, sub: hubSub, title: hubTitle,
    aria: "Map centre: " + hubTitle, sel: false, i: 0
  });
  html += '<div class="bmap-hub-caption">' + esc(hubCaption) + "</div>";

  bmapOrbitLayout(items).forEach((pos) => {
    const it = pos.item;
    it.size = pos.size;
    it.angle = pos.angle;
    it.rFrac = pos.rFrac;
    it.i = pos.i;
    it.dim = bmapSearchDim(it.hay);
    it.sel = (it.deptAttr && state.bmap.deptId === it.deptAttr) ||
      (it.prodAttr && state.bmap.selected && state.bmap.selected.type === "prod" &&
        state.bmap.selected.family === it.prodAttr);
    html += bmapRenderBubble(it);
  });
  html += "</div>";
  if (items.length === 0) {
    html += '<div class="bmap-none">No bubbles at this level for the current filters.</div>';
  }
  html += "</div>";

  /* ----- right: scope summary, product slice, account list ----- */
  html += '<div class="bmap-side">';
  html += bmapScopeHtml(lvl === "dept" ? scope : scope);
  html += bmapProdChipsHtml();
  html += bmapListHtml(bmapSortDepts(lvl === "dept" ? listSource : scope));
  html += "</div>";

  html += "</div></div>";
  return html;
}

/* ============================ india map (places) ============================ */

/* Locations that survive the search and the shared filters, with the map's own
   ownership toggle applied on top. Returns per-state and per-city rollups plus
   the ownership breakdown used for colouring and the tooltips. */
function imapData() {
  const own = state.pmap.own;
  const byState = {};
  const byCity = {};
  let total = 0;

  filteredPlaces().forEach((st) => {
    st.cities.forEach((ci) => {
      ci.units.forEach((u) => {
        const dept = DATA.departments.find((d) => d.id === u.deptId);
        if (dept === undefined) return;
        const o = dept._ownership || "Other";
        if (own.size > 0 && own.has(o) === false) return;

        total += 1;
        if (byState[st.state] === undefined) {
          byState[st.state] = { state: st.state, n: 0, own: {}, orgs: {}, cities: {} };
        }
        const s = byState[st.state];
        s.n += 1;
        s.own[o] = (s.own[o] || 0) + 1;
        s.orgs[dept.acr] = true;
        s.cities[ci.city] = true;

        const key = ci.city + "|" + st.state;
        if (byCity[key] === undefined) {
          byCity[key] = { city: ci.city, state: st.state, n: 0, own: {}, orgs: {} };
        }
        const c = byCity[key];
        c.n += 1;
        c.own[o] = (c.own[o] || 0) + 1;
        c.orgs[dept.acr] = true;
      });
    });
  });

  return { byState: byState, byCity: byCity, total: total };
}

function imapDominant(ownCounts) {
  let best = null;
  let bestN = -1;
  OWNERSHIP_ORDER.forEach((o) => {
    const n = ownCounts[o] || 0;
    if (n > bestN) { bestN = n; best = o; }
  });
  return best;
}

function imapHue(ownName) {
  const s = OWNERSHIP_STYLE[ownName];
  return s ? s.hue : "#8899aa";
}

function imapSvg(data) {
  const maxState = Math.max.apply(null, [1].concat(
    Object.keys(data.byState).map((k) => data.byState[k].n)));

  let svg = '<svg class="imap__svg" viewBox="' + INDIA_GEO.viewBox +
    '" role="img" aria-label="Map of India showing defence account locations" preserveAspectRatio="xMidYMid meet">';

  /* States, tinted by how many matching locations they hold. */
  Object.keys(INDIA_GEO.states).forEach((name) => {
    const rec = data.byState[name];
    const n = rec ? rec.n : 0;
    let cls = "imap-state";
    let style = "";
    if (n > 0) {
      const hue = imapHue(imapDominant(rec.own));
      const t = 0.16 + 0.54 * Math.sqrt(n / maxState);
      cls += " imap-state--has";
      if (state.filters.states.has(name)) cls += " imap-state--sel";
      style = ' style="fill:' + hue + Math.round(t * 255).toString(16).padStart(2, "0") +
        ';stroke:' + hue + '"';
    }
    svg += '<path class="' + cls + '" d="' + INDIA_GEO.states[name] + '"' + style +
      (n > 0 ? ' data-imap-state="' + esc(name) + '" tabindex="0" role="button" aria-label="' +
        esc(name + ", " + n + " locations") + '"' : ' aria-hidden="true"') + "></path>";
  });

  /* City markers, sized by location count and coloured by dominant ownership. */
  const keys = Object.keys(data.byCity).sort((a, b) => data.byCity[a].n - data.byCity[b].n);
  const maxCity = Math.max.apply(null, [1].concat(keys.map((k) => data.byCity[k].n)));
  keys.forEach((k) => {
    const c = data.byCity[k];
    const pt = INDIA_GEO.cities[c.city];
    if (pt === undefined) return;
    const hue = imapHue(imapDominant(c.own));
    const r = 4.5 + 9 * Math.sqrt(c.n / maxCity);
    const sel = state.filters.cities.has(c.city);
    svg += '<g class="imap-city' + (sel ? " imap-city--sel" : "") + '" data-imap-city="' +
      esc(c.city) + '" data-imap-city-state="' + esc(c.state) + '" tabindex="0" role="button" aria-label="' +
      esc(c.city + ", " + c.state + ", " + c.n + " locations") + '">';
    if (sel) svg += '<circle class="imap-city__ping" cx="' + pt[0] + '" cy="' + pt[1] + '" r="4"></circle>';
    svg += '<circle class="imap-city__halo" cx="' + pt[0] + '" cy="' + pt[1] + '" r="' +
      (r * 2.1).toFixed(1) + '" fill="' + hue + '"></circle>';
    svg += '<circle class="imap-city__dot" cx="' + pt[0] + '" cy="' + pt[1] + '" r="' +
      r.toFixed(1) + '" fill="' + hue + '"></circle>';
    svg += "</g>";
  });

  return svg + "</svg>";
}

function imapFiltersHtml(data) {
  const counts = {};
  Object.keys(data.byState).forEach((k) => {
    const s = data.byState[k];
    Object.keys(s.own).forEach((o) => { counts[o] = (counts[o] || 0) + s.own[o]; });
  });

  /* Counts must ignore the ownership toggle itself, otherwise unselected
     categories always read zero and look empty. */
  const allCounts = {};
  const saved = state.pmap.own;
  state.pmap.own = new Set();
  const full = imapData();
  Object.keys(full.byState).forEach((k) => {
    const s = full.byState[k];
    Object.keys(s.own).forEach((o) => { allCounts[o] = (allCounts[o] || 0) + s.own[o]; });
  });
  state.pmap.own = saved;

  let html = '<div class="imap__filters">';
  html += '<button class="imap__chip imap__chip--all" type="button" data-imap-own="__all" aria-pressed="' +
    (state.pmap.own.size === 0 ? "true" : "false") + '">All ownership <b>' + full.total + "</b></button>";
  OWNERSHIP_ORDER.forEach((o) => {
    const st = OWNERSHIP_STYLE[o];
    if (st === undefined) return;
    const on = state.pmap.own.has(o);
    html += '<button class="imap__chip" type="button" data-imap-own="' + esc(o) +
      '" aria-pressed="' + (on ? "true" : "false") + '" style="color:' + st.hue + '">' +
      '<i></i><span style="color:rgba(255,255,255,.85)">' + esc(o) + "</span> <b>" +
      (allCounts[o] || 0) + "</b></button>";
  });
  html += "</div>";
  return html;
}

function imapHtml() {
  const data = imapData();
  const stateCount = Object.keys(data.byState).length;
  const cityCount = Object.keys(data.byCity).length;
  const orgs = {};
  Object.keys(data.byState).forEach((k) => {
    Object.keys(data.byState[k].orgs).forEach((a) => { orgs[a] = true; });
  });

  let html = '<div class="imap">';
  html += '<div class="imap__head"><span class="imap__title">Where the accounts are</span>' +
    '<span class="imap__sub">Tap a state or city to filter everything below</span></div>';
  html += imapFiltersHtml(data);
  html += '<div class="imap__body">';
  html += '<div class="imap__stage">' + imapSvg(data) + "</div>";

  html += '<div class="imap__side">';
  html += '<div class="imap__stats">' +
    '<div class="imap__stat"><b>' + data.total + "</b><span>Locations</span></div>" +
    '<div class="imap__stat"><b>' + cityCount + "</b><span>Cities</span></div>" +
    '<div class="imap__stat"><b>' + stateCount + "</b><span>States</span></div>" +
    '<div class="imap__stat"><b>' + Object.keys(orgs).length + "</b><span>Organisations</span></div>" +
    "</div>";

  /* Top states give the map a readable summary without needing hover. */
  const top = Object.keys(data.byState)
    .map((k) => data.byState[k])
    .sort((a, b) => b.n - a.n)
    .slice(0, 5);
  if (top.length > 0) {
    html += '<div class="imap-tip__bars" style="gap:5px">';
    top.forEach((s) => {
      html += '<div class="imap-tip__bar" style="color:' + imapHue(imapDominant(s.own)) +
        '"><i></i><span style="color:rgba(255,255,255,.72)">' + esc(s.state) + "</span><u>" + s.n + "</u></div>";
    });
    html += "</div>";
  }

  const picked = state.filters.states.size + state.filters.cities.size;
  html += '<div class="imap__hint">' +
    (picked > 0
      ? '<button class="imap__reset" type="button" data-imap-reset="1">Clear map selection</button>'
      : "Dot size is how many locations sit in a city. Colour is who owns them.") +
    "</div>";
  html += "</div></div>";
  return html + "</div>";
}

function imapTipHtml(el) {
  const data = imapData();
  const cityName = el.getAttribute("data-imap-city");
  const stateName = el.getAttribute("data-imap-state");

  function bars(ownCounts) {
    let out = '<div class="imap-tip__bars">';
    OWNERSHIP_ORDER.forEach((o) => {
      const n = ownCounts[o] || 0;
      if (n === 0) return;
      out += '<div class="imap-tip__bar" style="color:' + imapHue(o) + '"><i></i>' +
        '<span style="color:rgba(255,255,255,.7)">' + esc(o) + "</span><u>" + n + "</u></div>";
    });
    return out + "</div>";
  }

  if (cityName) {
    const key = cityName + "|" + el.getAttribute("data-imap-city-state");
    const c = data.byCity[key];
    if (c === undefined) return "";
    const orgs = Object.keys(c.orgs);
    return '<div class="imap-tip__t">' + esc(c.city) + "</div>" +
      '<div class="imap-tip__row">' + esc(c.state) + " \u00b7 " + c.n + " location" + (c.n === 1 ? "" : "s") +
      " \u00b7 " + orgs.length + " organisation" + (orgs.length === 1 ? "" : "s") + "</div>" +
      bars(c.own) +
      '<div class="imap-tip__row" style="margin-top:7px">' +
      esc(orgs.slice(0, 8).join(", ") + (orgs.length > 8 ? " and " + (orgs.length - 8) + " more" : "")) + "</div>";
  }

  if (stateName) {
    const s = data.byState[stateName];
    if (s === undefined) return "";
    const orgs = Object.keys(s.orgs);
    const cities = Object.keys(s.cities);
    return '<div class="imap-tip__t">' + esc(s.state) + "</div>" +
      '<div class="imap-tip__row">' + s.n + " locations \u00b7 " + cities.length + " cities \u00b7 " +
      orgs.length + " organisations</div>" + bars(s.own) +
      '<div class="imap-tip__row" style="margin-top:7px">' +
      esc(cities.slice(0, 6).join(", ") + (cities.length > 6 ? " and " + (cities.length - 6) + " more" : "")) + "</div>";
  }
  return "";
}

function imapEnsureTip() {
  let tip = document.getElementById("imapTip");
  if (tip === null) {
    tip = document.createElement("div");
    tip.id = "imapTip";
    tip.className = "imap-tip";
    tip.hidden = true;
    document.body.appendChild(tip);
  }
  return tip;
}

function imapHideTip() {
  const tip = document.getElementById("imapTip");
  if (tip !== null) tip.hidden = true;
}

function imapShowTip(el, clientX, clientY) {
  if (state.view !== "places") return;
  const html = imapTipHtml(el);
  if (html === "") return;
  const tip = imapEnsureTip();
  tip.innerHTML = html;
  tip.hidden = false;
  const pad = 14;
  let left = clientX + pad;
  let top = clientY + pad;
  tip.style.left = left + "px";
  tip.style.top = top + "px";
  const r = tip.getBoundingClientRect();
  if (r.right > window.innerWidth - 8) left = clientX - r.width - pad;
  if (r.bottom > window.innerHeight - 8) top = clientY - r.height - pad;
  tip.style.left = Math.max(8, left) + "px";
  tip.style.top = Math.max(8, top) + "px";
}

function viewPlaces() {
  const own = state.pmap.own;
  const raw = filteredPlaces();

  /* Apply the map's ownership toggle to the list as well, so the map and the
     list below it never disagree about what is in scope. */
  const list = [];
  raw.forEach((st) => {
    const cities = [];
    st.cities.forEach((ci) => {
      const units = ci.units.filter((u) => {
        if (own.size === 0) return true;
        const dept = DATA.departments.find((d) => d.id === u.deptId);
        return dept !== undefined && own.has(dept._ownership || "Other");
      });
      if (units.length > 0) cities.push({ city: ci.city, units: units });
    });
    if (cities.length > 0) list.push({ state: st.state, cities: cities });
  });

  const unitCount = list.reduce((n, st) => n + st.cities.reduce((m, c) => m + c.units.length, 0), 0);

  let html = head("Places", "An India map of every located unit. Filter by who owns the account, then drill into a state or city.");
  html += renderFilterBar();
  html += imapHtml();
  html += '<div class="resultbar">' + unitCount + " locations across " + list.length + " states</div>";

  if (list.length === 0) {
    return html + '<div class="empty">No locations match that. Try clearing a filter or broadening your search.</div>';
  }

  list.forEach((st) => {
    const sid = "place-" + st.state;
    const open = state.open.has(sid) || state.query.trim().length >= 2;
    const cityCount = st.cities.length;
    const locCount = st.cities.reduce((n, c) => n + c.units.length, 0);

    html += '<div class="place-state"><button class="place-state__btn" type="button" data-place-state="' +
      esc(st.state) + '" aria-expanded="' + (open ? "true" : "false") + '">' +
      '<span class="card__caret">' + ICON.caret + '</span><span class="place-state__t">' + hl(st.state) +
      '</span><span class="place-state__c">' + locCount + ' loc \u00b7 ' + cityCount + ' cities</span></button>';

    html += '<div class="place-city"' + (open ? "" : " hidden") + ">";
    st.cities.forEach((ci) => {
      html += '<div class="place-city__h">' + hl(ci.city) + "</div>";
      ci.units.forEach((u) => {
        html += '<div class="place-unit"><b>' + hl(u.n) + '</b><span class="org">' + hl(u.deptName) +
          " &middot; " + hl(u.deptAcr) + "</span>" +
          '<button class="jump" type="button" data-jump="' + esc(u.deptId) + '">Open &rarr;</button></div>';
      });
    });
    html += "</div></div>";
  });

  return html;
}

function viewRoles() {
  const list = filteredRoles();
  const searching = state.query.trim().length >= 2;

  /* Grouped by organisation and collapsed by default: a flat list of every role
     is tens of screens long and impossible to scan. */
  const groups = [];
  DATA.departments.forEach((d) => {
    const roles = list.filter((r) => r.deptId === d.id);
    if (roles.length > 0) groups.push({ dept: d, roles: roles });
  });

  let html = head("Find by role", "Search the job title on the business card, or open an organisation to see who sits in it.");
  html += renderFilterBar();
  html += '<div class="resultbar">' + list.length + " roles across " + groups.length + " organisations" +
    (state.open.size > 0 ? '<button class="linkbtn" type="button" data-collapse="1">Collapse all</button>' : "") +
    "</div>";

  if (groups.length === 0) {
    return html + '<div class="empty">No role matches that. Try a fragment such as &ldquo;engineer&rdquo;, &ldquo;scientist&rdquo; or &ldquo;director&rdquo;.</div>';
  }

  groups.forEach((g) => {
    const gid = "rg-" + g.dept.id;
    const open = searching || state.open.has(gid);

    html += '<div class="rolegrp"><button class="rolegrp__btn" type="button" data-toggle="' + esc(gid) +
      '" aria-expanded="' + (open ? "true" : "false") + '" aria-controls="' + gid + '">' +
      '<span class="card__caret">' + ICON.caret + "</span>" +
      '<span class="rolegrp__t">' + hl(g.dept.name) + ' <span class="card__acr">' + hl(g.dept.acr) + "</span></span>" +
      '<span class="rolegrp__n">' + g.roles.length + " roles</span></button>";

    html += '<div class="rolegrp__body" id="' + gid + '"' + (open ? "" : " hidden") + ">";
    g.roles.forEach((r) => {
      html += '<div class="role"><div class="role__t">' + hl(r.title) +
        '<span class="lvlbadge">' + esc(LVL_LABELS[r.lvl] || ("L" + r.lvl)) + "</span></div>";
      if (r.chain !== "") html += '<div class="chain">' + hl(r.chain) + "</div>";
      html += '<div class="persona__d" style="margin-top:7px"><b>Cares about:</b> ' + hl(r.cares) + "<br>" +

function viewQuestions() {
  const q = state.query.trim().toLowerCase();
  const groups = [];

  filteredDepartments().forEach((d) => {
    const qs = q === "" ? d.questions : d.questions.filter((x) => matches(x.toLowerCase()));

    if (keep.length > 0) groups.push({ d: d, qs: keep });
  });

  const total = groups.reduce((n, g) => n + g.qs.length, 0);

  const searching = q.length >= 2;

  let html = head("Question bank", "Open an organisation to see its discovery questions, or copy a whole set into your meeting notes.");
  html += renderFilterBar();
  html += '<div class="resultbar">' + total + " questions across " + groups.length + " organisations" +
    (state.open.size > 0 ? '<button class="linkbtn" type="button" data-collapse="1">Collapse all</button>' : "") +

function copyQuestions(id) {
  const dept = DATA.departments.find((d) => d.id === id);
  if (dept === undefined) return;
  const text = dept.name + " (" + dept.acr + ") \u2014 discovery questions\n\n" +
    dept.questions.map((q, i) => (i + 1) + ". " + q).join("\n");

  const done = () => toast("Questions copied");
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); }
    catch (err) { toast("Copy blocked by the browser"); }
    document.body.removeChild(ta);
  };

  if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
    navigator.clipboard.writeText(text).then(done, fallback);
  } else {
    fallback();
  }
}

/* Hash routes so each tab has a copy-pasteable URL, e.g. #places or #departments/hal. */
const ROUTE_VIEW_IDS = new Set(VIEWS.map((v) => v.id));

function buildRouteHash(route) {
  const view = ROUTE_VIEW_IDS.has(route.view) ? route.view : "departments";
  if (view === "departments" && typeof route.account === "string" && route.account !== "") {
    return "#" + view + "/" + encodeURIComponent(route.account);
  }
  return "#" + view;
}

function routeUrl(route) {
  return window.location.pathname + window.location.search + buildRouteHash(route);
}

function currentUrl() {
  return window.location.pathname + window.location.search + (window.location.hash || "");
}

function parseRoute() {
  const raw = (window.location.hash || "").replace(/^#\/?/, "").trim();
  if (raw === "") return { view: "departments", account: null };
  const slash = raw.indexOf("/");
  const viewPart = slash === -1 ? raw : raw.slice(0, slash);
  const accountPart = slash === -1 ? null : decodeURIComponent(raw.slice(slash + 1));
  const view = ROUTE_VIEW_IDS.has(viewPart) ? viewPart : "departments";
  return { view, account: accountPart };
}

function writeRoute(route, opts) {
  const replace = opts && opts.replace === true;
  const payload = { view: route.view, account: route.account || null };
  const url = routeUrl(payload);
  if (currentUrl() === url) return;
  if (replace === true) {
    history.replaceState({ modRoute: payload }, "", url);
  } else {
    history.pushState({ modRoute: payload }, "", url);
  }
}

function applyRoute(route, opts) {
  const skipHash = opts && opts.skipHash === true;
  const view = ROUTE_VIEW_IDS.has(route.view) ? route.view : "departments";
  if (view !== "map" && state.view === "map") bmapReset();
  state.view = view;
  state.filtersOpen = false;
  if (view === "departments" && route.account) {
    const exists = DATA.departments.some((d) => d.id === route.account);
    if (exists) {
      state.open.clear();
      state.open.add(route.account);
    }
  }
  render();
  if (skipHash !== true) {
    writeRoute({ view, account: view === "departments" ? route.account : null }, opts);
  }
  window.scrollTo(0, 0);
}

function setView(id) {
  if (RENDERERS[id] === undefined) return;
  applyRoute({ view: id, account: null });
}

window.addEventListener("popstate", () => {
  applyRoute(parseRoute(), { skipHash: true });
});

window.addEventListener("hashchange", () => {
  applyRoute(parseRoute(), { skipHash: true });
});

function setSheetOpen(open) {
  const host = sheetHost();
  const sheet = host.querySelector(".sheet");
  const backdrop = host.querySelector(".sheetbackdrop");
  if (sheet !== null) sheet.classList.toggle("show", open);
  if (backdrop !== null) backdrop.classList.toggle("show", open);
  const btn = $("#toolbar [data-filter-open]");
  if (btn !== null) btn.setAttribute("aria-expanded", open ? "true" : "false");
}

function openFilterSheet() {
  if (FILTERABLE[state.view] !== true) return;
  state.draftFilters = cloneFilters(state.filters);
  state.filtersOpen = true;

  const host = sheetHost();
  host.innerHTML = renderFilterSheet();
  const sheet = host.querySelector(".sheet");
  /* Force a layout pass so the closed position becomes the transition's start
     value. Deferring this to requestAnimationFrame is unreliable and can
     re-open the panel after it has been dismissed. */
  if (sheet !== null) void sheet.offsetHeight;
  setSheetOpen(true);
}

function closeFilterSheet() {
  state.filtersOpen = false;
  setSheetOpen(false);
}

function applyDraftFilters() {
  state.filters = cloneFilters(state.draftFilters);
  closeFilterSheet();
  render();
}

/* Replaces only the facet list, keeping its scroll offset, so that picking
   several filters in a row does not bounce the user back to the top. */
function refreshSheetBody() {
  const body = document.querySelector(".sheet__body");
  if (body !== null) {
    const offset = body.scrollTop;
    body.innerHTML = renderFacetGroups(state.draftFilters);
    body.scrollTop = offset;
  }
  const apply = document.querySelector("[data-filter-apply]");
  if (apply !== null) apply.textContent = draftSummary();
}

function handleFacetClick(facet, value) {
  toggleFacet(facet, value, state.draftFilters);
  /* A narrower facet can become unreachable when its parent changes. */
  pruneFilters(state.draftFilters);
  refreshSheetBody();
}

document.addEventListener("click", (ev) => {
  const t = ev.target;
  if (t instanceof Element === false) return;

  const nav = t.closest("[data-view]");
  if (nav !== null) { setView(nav.getAttribute("data-view")); return; }

  const bmapBack = t.closest("[data-bmap-back]");
  if (bmapBack !== null) {
    if (state.bmap.deptId) {
      state.bmap.deptId = null;
      state.bmap.selected = null;
      /* Drop straight past an empty cluster level rather than showing a
         one-bubble ring the user never chose. */
      if (state.bmap.cluster && bmapUsesClusters(state.bmap.own) === false) state.bmap.cluster = null;
    } else if (state.bmap.cluster) {
      state.bmap.cluster = null;
    } else if (state.bmap.own) {
      state.bmap.own = null;
    }
    state.bmap.prod = null;
    bmapHideTip();
    render();
    return;
  }

  const bmapRoot = t.closest("[data-bmap-root]");
  if (bmapRoot !== null) { bmapReset(); render(); return; }

  const bmapGoOwn = t.closest("[data-bmap-goown]");
  if (bmapGoOwn !== null) {
    state.bmap.cluster = null;
    state.bmap.deptId = null;
    state.bmap.selected = null;
    state.bmap.prod = null;
    bmapHideTip();
    render();
    return;
  }

  const bmapGoCluster = t.closest("[data-bmap-gocluster]");
  if (bmapGoCluster !== null) {
    state.bmap.deptId = null;
    state.bmap.selected = null;
    bmapHideTip();
    render();
    return;
  }

  const bmapOwn = t.closest("[data-bmap-own]");
  if (bmapOwn !== null) {
    state.bmap.own = bmapOwn.getAttribute("data-bmap-own");
    state.bmap.cluster = null;
    state.bmap.deptId = null;
    state.bmap.selected = null;
    state.bmap.prod = null;
    bmapHideTip();
    render();
    return;
  }

  const bmapCluster = t.closest("[data-bmap-cluster]");
  if (bmapCluster !== null) {
    state.bmap.cluster = bmapCluster.getAttribute("data-bmap-cluster");
    state.bmap.deptId = null;
    state.bmap.selected = null;
    bmapHideTip();
    render();
    return;
  }

  const bmapDept = t.closest("[data-bmap-dept]");
  if (bmapDept !== null) {
    const deptId = bmapDept.getAttribute("data-bmap-dept");
    const dept = DATA.departments.find((d) => d.id === deptId);
    if (dept !== undefined) {
      state.bmap.own = dept._ownership;
      if (bmapUsesClusters(dept._ownership)) state.bmap.cluster = dept.cluster;
    }
    state.bmap.deptId = deptId;
    state.bmap.selected = null;
    bmapHideTip();
    render();
    return;
  }

  const bmapProd = t.closest("[data-bmap-prod]");
  if (bmapProd !== null) {
    state.bmap.selected = { type: "prod", family: bmapProd.getAttribute("data-bmap-prod") };
    bmapHideTip();
    render();
    return;
  }

  const bmapProdFilter = t.closest("[data-bmap-prodfilter]");
  if (bmapProdFilter !== null) {
    const v = bmapProdFilter.getAttribute("data-bmap-prodfilter");
    state.bmap.prod = (v === "__all" || state.bmap.prod === v) ? null : v;
    bmapHideTip();
    render();
    return;
  }

  const dsort = t.closest("[data-dsort]");
  if (dsort !== null) {
    state.dsort = dsort.getAttribute("data-dsort");
    render();
    window.scrollTo(0, 0);
    return;
  }

  const bmapSort = t.closest("[data-bmap-sort]");
  if (bmapSort !== null) {
    state.bmap.sort = bmapSort.getAttribute("data-bmap-sort");
    render();
    return;
  }

  const filterOpen = t.closest("[data-filter-open]");
  if (filterOpen !== null) { openFilterSheet(); return; }

  const filterClose = t.closest("[data-filter-close]");
  if (filterClose !== null) { closeFilterSheet(); return; }

  const filterApply = t.closest("[data-filter-apply]");
  if (filterApply !== null) { applyDraftFilters(); return; }

  const filterClear = t.closest("[data-filter-clear]");
  if (filterClear !== null) {
    state.draftFilters = emptyFilters();
    refreshSheetBody();
    return;
  }

  const clearFilters = t.closest("[data-clear-filters]");
  if (clearFilters !== null) { clearAllFilters(); render(); return; }

  const rmFilter = t.closest("[data-rm-filter]");
  if (rmFilter !== null) {
    const facet = rmFilter.getAttribute("data-rm-filter");
    const val = rmFilter.getAttribute("data-value");
    removeFilter(facet, val);
    pruneFilters(state.filters);
    render();
    return;
  }

  const facetBtn = t.closest("[data-facet]");
  if (facetBtn !== null) {
    handleFacetClick(facetBtn.getAttribute("data-facet"), facetBtn.getAttribute("data-value"));
    return;
  }

  const imapOwn = t.closest("[data-imap-own]");
  if (imapOwn !== null) {
    const val = imapOwn.getAttribute("data-imap-own");
    if (val === "__all") state.pmap.own = new Set();
    else if (state.pmap.own.has(val)) state.pmap.own.delete(val);
    else state.pmap.own.add(val);
    imapHideTip();
    render();
    return;
  }

  const imapReset = t.closest("[data-imap-reset]");
  if (imapReset !== null) {
    state.filters.states = new Set();
    state.filters.cities = new Set();
    imapHideTip();
    render();
    return;
  }

  const imapCity = t.closest("[data-imap-city]");
  if (imapCity !== null) {
    const city = imapCity.getAttribute("data-imap-city");
    const st = imapCity.getAttribute("data-imap-city-state");
    if (state.filters.cities.has(city)) {
      state.filters.cities.delete(city);
    } else {
      /* A city filter only resolves once its state is in scope. */
      state.filters.states.add(st);
      state.filters.cities.add(city);
      state.open.add("place-" + st);
    }
    imapHideTip();
    render();
    return;
  }

  const imapState = t.closest("[data-imap-state]");
  if (imapState !== null) {
    const name = imapState.getAttribute("data-imap-state");
    if (state.filters.states.has(name)) {
      state.filters.states.delete(name);
      /* Cities in that state would otherwise filter everything to nothing. */
      Array.from(state.filters.cities).forEach((c) => {
        if ((CITIES_BY_STATE[name] || []).indexOf(c) !== -1) state.filters.cities.delete(c);
      });
    } else {
      state.filters.states.add(name);
      state.open.add("place-" + name);
    }
    imapHideTip();
    render();
    return;
  }

  const placeState = t.closest("[data-place-state]");
  if (placeState !== null) {
    const sid = "place-" + placeState.getAttribute("data-place-state");
    if (state.open.has(sid)) state.open.delete(sid);
    else state.open.add(sid);
    render();
    return;
  }

  const toggle = t.closest("[data-toggle]");
  if (toggle !== null) {
    const id = toggle.getAttribute("data-toggle");
    if (state.open.has(id)) state.open.delete(id);
    else state.open.add(id);
    render();
    const nested = /^(obj-|rg-|qg-)/.test(id);
    const el = document.getElementById(nested ? id : "dept-" + id);
    if (el !== null && state.open.has(id)) {
      const anchor = nested ? el.closest(".obj, .rolegrp, .qgroup") : el;
      if (anchor !== null) anchor.scrollIntoView({ block: "nearest" });
    }
    return;
  }

  const mark = t.closest("[data-mark]");
  if (mark !== null) {
    const id = mark.getAttribute("data-mark");
    if (state.marks.has(id)) { state.marks.delete(id); toast("Removed from my targets"); }
    else { state.marks.add(id); toast("Saved to my targets"); }
    saveBookmarks();
    render();
    return;
  }

  const copy = t.closest("[data-copy]");
  if (copy !== null) { copyQuestions(copy.getAttribute("data-copy")); return; }

  const collapse = t.closest("[data-collapse]");
  if (collapse !== null) { state.open.clear(); render(); return; }

  const jump = t.closest("[data-jump]");
  if (jump !== null) {
    const id = jump.getAttribute("data-jump");
    state.query = "";
    clearAllFilters();
    closeFilterSheet();
    const qEl = $("#q");
    if (qEl !== null) qEl.value = "";
    const qClear = $("#qclear");
    if (qClear !== null) qClear.hidden = true;
    applyRoute({ view: "departments", account: id });
    const el = document.getElementById("dept-" + id);
    if (el !== null) el.scrollIntoView({ behavior: "smooth", block: "start" });
  }
});

document.addEventListener("pointerover", (ev) => {
  if (state.view === "map") {
    const rt = ev.target;
    if (rt instanceof Element) {
      const row = rt.closest("[data-bmap-row]");
      if (row !== null) { bmapSyncBubble(row.getAttribute("data-bmap-row"), true); return; }
    }
  }
  if (state.view === "places") {
    const pt = ev.target;
    if (pt instanceof Element) {
      const node = pt.closest("[data-imap-city],[data-imap-state]");
      if (node !== null) imapShowTip(node, ev.clientX, ev.clientY);
    }
    return;
  }
  if (state.view !== "map") return;
  const t = ev.target;
  if (t instanceof Element === false) return;
  const bubble = t.closest(".bmap-bubble");
  if (bubble === null) return;
  const related = ev.relatedTarget;
  if (related instanceof Node && bubble.contains(related)) return;
  bmapHoverBubble = bubble;
  bmapPosition();
  bmapShowTip(bubble, ev.clientX, ev.clientY);
  bmapSyncRow(bubble, true);
});

document.addEventListener("pointerout", (ev) => {
  if (state.view === "map") {
    const rt = ev.target;

      const row = rt.closest("[data-bmap-row]");
      if (row !== null) { bmapSyncBubble(row.getAttribute("data-bmap-row"), false); return; }

    const pt = ev.target;
    if (pt instanceof Element && pt.closest("[data-imap-city],[data-imap-state]") !== null) {
      imapHideTip();

  }
  if (state.view !== "map") return;
  const t = ev.target;
  if (t instanceof Element === false) return;
  const bubble = t.closest(".bmap-bubble");
  if (bubble === null) return;
  const related = ev.relatedTarget;
  if (related instanceof Node && bubble.contains(related)) return;
  bmapHoverBubble = null;
  bmapHideTip();
  bmapSyncRow(bubble, false);
  bmapPosition();
});

document.addEventListener("focusin", (ev) => {
  if (state.view === "places") {
    const pt = ev.target;
    if (pt instanceof Element) {
      const node = pt.closest("[data-imap-city],[data-imap-state]");
      if (node !== null) {
        const r = node.getBoundingClientRect();
        imapShowTip(node, r.left + r.width / 2, r.top);
      }
    }
    return;
  }
  if (state.view !== "map") return;
  const t = ev.target;
  if (t instanceof Element === false) return;
  const bubble = t.closest(".bmap-bubble");
  if (bubble === null) return;
  bmapHoverBubble = bubble;
  bmapPosition();
  const rect = bubble.getBoundingClientRect();
  bmapShowTip(bubble, rect.left + rect.width / 2, rect.top);
  bmapSyncRow(bubble, true);
});

document.addEventListener("focusout", (ev) => {
  if (state.view === "places") {
    imapHideTip();
    return;
  }
  if (state.view !== "map") return;
  const t = ev.target;
  if (t instanceof Element === false) return;
  const bubble = t.closest(".bmap-bubble");
  if (bubble === null) return;
  bmapHoverBubble = null;
  bmapHideTip();
  bmapSyncRow(bubble, false);
  bmapPosition();
});

applyRoute(parseRoute(), { replace: true });

</script>
</body>
</html>
